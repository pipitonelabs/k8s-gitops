---
# No Kubernetes RBAC: the image-pull job only talks to the Talos API, so this SA has no bindings.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: k8s-gitops-runner
automountServiceAccountToken: false
---
apiVersion: talos.dev/v1alpha1
kind: ServiceAccount
metadata:
  name: k8s-gitops-runner
spec:
  # /machine.ImageService/Pull requires Admin or Operator (siderolabs/talos machined.go)
  roles: ["os:operator"]
