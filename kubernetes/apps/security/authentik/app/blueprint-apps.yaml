---
# Authentik blueprint for the OIDC apps formerly managed by terraform/authentik:
# grafana and outline. Mounted into /blueprints by the chart (see
# helmrelease.yaml: blueprints.configMaps). Providers are matched by name and
# applications by slug, so this adopts the existing objects. client_id/secret come
# from env (<APP>_CLIENT_ID / <APP>_CLIENT_SECRET), provided via the
# authentik-secret ExternalSecret (1Password items grafana, outline).
# Tokens are RS256, signed with the Authentik self-signed keypair, 4h access tokens.
# Flows come from blueprint-core.yaml and are looked up by slug.
apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-blueprint-apps
data:
  apps.yaml: |
    version: 1
    metadata:
      name: apps-oidc
    entries:
      # --- grafana --------------------------------------------------------
      - id: grafana-provider
        model: authentik_providers_oauth2.oauth2provider
        identifiers:
          name: grafana
        attrs:
          client_type: confidential
          client_id: !Env GRAFANA_CLIENT_ID
          client_secret: !Env GRAFANA_CLIENT_SECRET
          access_token_validity: hours=4
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
          authorization_flow: !Find [authentik_flows.flow, [slug, provider-authorization-implicit-consent]]
          authentication_flow: !Find [authentik_flows.flow, [slug, authentication-flow]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, invalidation-flow]]
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
          redirect_uris:
            - matching_mode: strict
              url: https://grafana.pipitonelabs.com/login/generic_oauth
      - id: grafana-app
        model: authentik_core.application
        identifiers:
          slug: grafana
        attrs:
          name: Grafana
          provider: !KeyOf grafana-provider
          group: Monitoring
          open_in_new_tab: true
          meta_icon: https://raw.githubusercontent.com/homarr-labs/dashboard-icons/main/png/grafana.png
          meta_launch_url: https://grafana.pipitonelabs.com/login/generic_oauth
          policy_engine_mode: all
      - model: authentik_policies.policybinding
        identifiers:
          target: !KeyOf grafana-app
          group: !Find [authentik_core.group, [name, Monitoring]]
          order: 0
        attrs:
          enabled: true

      # --- outline --------------------------------------------------------
      - id: outline-provider
        model: authentik_providers_oauth2.oauth2provider
        identifiers:
          name: outline
        attrs:
          client_type: confidential
          client_id: !Env OUTLINE_OAUTH_CLIENT_ID
          client_secret: !Env OUTLINE_OAUTH_CLIENT_SECRET
          access_token_validity: hours=4
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
          authorization_flow: !Find [authentik_flows.flow, [slug, provider-authorization-implicit-consent]]
          authentication_flow: !Find [authentik_flows.flow, [slug, authentication-flow]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, invalidation-flow]]
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
          redirect_uris:
            - matching_mode: strict
              url: https://outline.pipitonelabs.com/auth/oidc.callback
      - id: outline-app
        model: authentik_core.application
        identifiers:
          slug: outline
        attrs:
          name: Outline
          provider: !KeyOf outline-provider
          group: Self Hosted
          open_in_new_tab: true
          meta_icon: https://avatars.githubusercontent.com/u/1765001?s=48&v=4
          meta_launch_url: https://outline.pipitonelabs.com/
          policy_engine_mode: all
      - model: authentik_policies.policybinding
        identifiers:
          target: !KeyOf outline-app
          group: !Find [authentik_core.group, [name, Self Hosted]]
          order: 0
        attrs:
          enabled: true

      # --- garage (web ui, behind an Envoy Gateway SecurityPolicy) --------
      - id: garage-provider
        model: authentik_providers_oauth2.oauth2provider
        identifiers:
          name: garage
        attrs:
          client_type: confidential
          client_id: garage
          grant_types:
            - authorization_code
            - refresh_token
          client_secret: !Env GARAGE_OIDC_CLIENT_SECRET
          access_token_validity: hours=4
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
          authorization_flow: !Find [authentik_flows.flow, [slug, provider-authorization-implicit-consent]]
          authentication_flow: !Find [authentik_flows.flow, [slug, authentication-flow]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, invalidation-flow]]
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
          redirect_uris:
            - matching_mode: strict
              url: https://garage.pipitonelabs.com/oauth2/callback
      - id: garage-app
        model: authentik_core.application
        identifiers:
          slug: garage
        attrs:
          name: Garage
          provider: !KeyOf garage-provider
          group: Infrastructure
          open_in_new_tab: true
          meta_icon: https://raw.githubusercontent.com/homarr-labs/dashboard-icons/main/png/garage.png
          meta_launch_url: https://garage.pipitonelabs.com/
          policy_engine_mode: all
      - model: authentik_policies.policybinding
        identifiers:
          target: !KeyOf garage-app
          user: !Find [authentik_core.user, [username, joe]]
          order: 0
        attrs:
          enabled: true

      # --- network-optimizer (native OIDC, configured in the app's Sign-In settings) --
      # The app's callback is /signin-oidc/<scheme key>, where the key is generated when the
      # provider is added in its UI, so the redirect URIs match by regex.
      - id: network-optimizer-provider
        model: authentik_providers_oauth2.oauth2provider
        identifiers:
          name: network-optimizer
        attrs:
          client_type: confidential
          client_id: network-optimizer
          grant_types:
            - authorization_code
            - refresh_token
          client_secret: !Env NETWORK_OPTIMIZER_OIDC_CLIENT_SECRET
          access_token_validity: hours=4
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
          authorization_flow: !Find [authentik_flows.flow, [slug, provider-authorization-implicit-consent]]
          authentication_flow: !Find [authentik_flows.flow, [slug, authentication-flow]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, invalidation-flow]]
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
          redirect_uris:
            - matching_mode: regex
              url: https://optimizer\.pipitonelabs\.com/signin-oidc/.+
            - matching_mode: regex
              url: https://optimizer\.pipitonelabs\.com/signout-callback-oidc/.+
              redirect_uri_type: logout
      - id: network-optimizer-app
        model: authentik_core.application
        identifiers:
          slug: network-optimizer
        attrs:
          name: Network Optimizer
          provider: !KeyOf network-optimizer-provider
          group: Networking
          open_in_new_tab: true
          meta_launch_url: https://optimizer.pipitonelabs.com/
          policy_engine_mode: all
      - model: authentik_policies.policybinding
        identifiers:
          target: !KeyOf network-optimizer-app
          user: !Find [authentik_core.user, [username, joe]]
          order: 0
        attrs:
          enabled: true

      # --- forgejo (auth source "authentik" is created in Forgejo's DB, see PR notes) --
      - id: forgejo-provider
        model: authentik_providers_oauth2.oauth2provider
        identifiers:
          name: forgejo
        attrs:
          client_type: confidential
          client_id: forgejo
          grant_types:
            - authorization_code
            - refresh_token
          client_secret: !Env FORGEJO_OIDC_CLIENT_SECRET
          access_token_validity: hours=4
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
          authorization_flow: !Find [authentik_flows.flow, [slug, provider-authorization-implicit-consent]]
          authentication_flow: !Find [authentik_flows.flow, [slug, authentication-flow]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, invalidation-flow]]
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
          redirect_uris:
            - matching_mode: strict
              url: https://git.pipitonelabs.com/user/oauth2/authentik/callback
      - id: forgejo-app
        model: authentik_core.application
        identifiers:
          slug: forgejo
        attrs:
          name: Forgejo
          provider: !KeyOf forgejo-provider
          group: Self Hosted
          open_in_new_tab: true
          meta_icon: https://raw.githubusercontent.com/homarr-labs/dashboard-icons/main/png/forgejo.png
          meta_launch_url: https://git.pipitonelabs.com/
          policy_engine_mode: all
      - model: authentik_policies.policybinding
        identifiers:
          target: !KeyOf forgejo-app
          user: !Find [authentik_core.user, [username, joe]]
          order: 0
        attrs:
          enabled: true

      # --- kopia (web ui, behind an Envoy Gateway SecurityPolicy) --------
      - id: kopia-provider
        model: authentik_providers_oauth2.oauth2provider
        identifiers:
          name: kopia
        attrs:
          client_type: confidential
          client_id: kopia
          grant_types:
            - authorization_code
            - refresh_token
          client_secret: !Env KOPIA_OIDC_CLIENT_SECRET
          access_token_validity: hours=4
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
          authorization_flow: !Find [authentik_flows.flow, [slug, provider-authorization-implicit-consent]]
          authentication_flow: !Find [authentik_flows.flow, [slug, authentication-flow]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, invalidation-flow]]
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
          redirect_uris:
            - matching_mode: strict
              url: https://kopia.pipitonelabs.com/oauth2/callback
      - id: kopia-app
        model: authentik_core.application
        identifiers:
          slug: kopia
        attrs:
          name: Kopia
          provider: !KeyOf kopia-provider
          group: Infrastructure
          open_in_new_tab: true
          meta_icon: https://raw.githubusercontent.com/homarr-labs/dashboard-icons/main/png/kopia.png
          meta_launch_url: https://kopia.pipitonelabs.com/
          policy_engine_mode: all
      - model: authentik_policies.policybinding
        identifiers:
          target: !KeyOf kopia-app
          user: !Find [authentik_core.user, [username, joe]]
          order: 0
        attrs:
          enabled: true
