---
# yaml-language-server: $schema=https://kube-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name authentik-secret
  namespace: security
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: *name
    template:
      data:
        AUTHENTIK_BOOTSTRAP_EMAIL: '{{ .AUTHENTIK_EMAIL }}'
        AUTHENTIK_BOOTSTRAP_PASSWORD: '{{ .AUTHENTIK_PASSWORD }}'
        AUTHENTIK_BOOTSTRAP_TOKEN: '{{ .AUTHENTIK_TOKEN }}'
        AUTHENTIK_SECRET_KEY: '{{ .AUTHENTIK_SECRET_KEY }}'
        # TradeForge OIDC (consumed by the tradeforge blueprint via !Env)
        TRADEFORGE_JWT_SECRET: '{{ .JWT_SECRET }}'
        TRADEFORGE_OIDC_CLIENT_ID: '{{ .oidc_client_id }}'
        # budget-app OIDC (consumed by the budget blueprint via !Env)
        BUDGET_OIDC_CLIENT_ID: '{{ .BUDGET_OIDC_CLIENT_ID }}'
        BUDGET_OIDC_CLIENT_SECRET: '{{ .BUDGET_OIDC_CLIENT_SECRET }}'
        # grafana / outline OIDC (consumed by the apps blueprint via !Env)
        GRAFANA_CLIENT_ID: '{{ .GRAFANA_CLIENT_ID }}'
        GRAFANA_CLIENT_SECRET: '{{ .GRAFANA_CLIENT_SECRET }}'
        OUTLINE_OAUTH_CLIENT_ID: '{{ .OUTLINE_OAUTH_CLIENT_ID }}'
        OUTLINE_OAUTH_CLIENT_SECRET: '{{ .OUTLINE_OAUTH_CLIENT_SECRET }}'
  dataFrom:
  - extract:
      key: authentik
  - extract:
      key: tradeforge
  - extract:
      key: budget
  data:
  - secretKey: GRAFANA_CLIENT_ID
    remoteRef:
      key: grafana
      property: GRAFANA_CLIENT_ID
  - secretKey: GRAFANA_CLIENT_SECRET
    remoteRef:
      key: grafana
      property: GRAFANA_CLIENT_SECRET
  - secretKey: OUTLINE_OAUTH_CLIENT_ID
    remoteRef:
      key: outline
      property: OUTLINE_OAUTH_CLIENT_ID
  - secretKey: OUTLINE_OAUTH_CLIENT_SECRET
    remoteRef:
      key: outline
      property: OUTLINE_OAUTH_CLIENT_SECRET
