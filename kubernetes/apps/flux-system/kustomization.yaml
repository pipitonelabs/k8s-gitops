---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: flux-system
components:
  - ../../components/namespace
patches:
  - target:
      kind: Namespace
    patch: |-
      apiVersion: v1
      kind: Namespace
      metadata:
        name: not-used
        labels:
          # routes in this namespace may attach to envoy-external (public)
          gateway.pipitonelabs.com/external: "true"
resources:
  - ./flux-instance/ks.yaml
  - ./flux-operator/ks.yaml