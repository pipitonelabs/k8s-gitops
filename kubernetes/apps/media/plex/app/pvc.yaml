---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: plex-cache
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 75Gi
  storageClassName: ceph-block
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: plex-superheavy-media
spec:
  accessModes: ["ReadOnlyMany"]
  capacity:
    storage: 1Mi
  claimRef:
    name: plex-superheavy-media
    namespace: media
  nfs:
    server: superheavy.internal
    path: /media
    readOnly: true
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: plex-superheavy-media
spec:
  accessModes: ["ReadOnlyMany"]
  resources:
    requests:
      storage: 1Mi
  storageClassName: ""
  volumeName: plex-superheavy-media
