---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &app profilarr
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: profilarr-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        PROFILARR_API_KEY: "{{ .PROFILARR_API_KEY }}"
  dataFrom:
    - extract:
        key: *app
