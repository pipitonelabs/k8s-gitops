---
# Same UNAS export as the other media apps; a PV binds to one claim, so each app gets its own
apiVersion: v1
kind: PersistentVolume
metadata:
  name: sabnzbd-unas-media
spec:
  accessModes: ["ReadWriteMany"]
  capacity:
    storage: 1Mi
  claimRef:
    name: sabnzbd-unas-media
    namespace: media
  # UNAS Pro only serves this export over NFSv3; overrides nfsvers=4.1 from nfsmount.conf
  mountOptions: ["nfsvers=3", "nolock", "tcp", "hard", "noatime"]
  nfs:
    server: superheavy.internal
    path: /volume/030ba2d3-244f-4673-bf9a-befbcba695ef/.srv/.unifi-drive/media/.data
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sabnzbd-unas-media
spec:
  accessModes: ["ReadWriteMany"]
  resources:
    requests:
      storage: 1Mi
  storageClassName: ""
  volumeName: sabnzbd-unas-media
---
# Completed downloads, shared with Radarr/Sonarr (RWX); incomplete downloads stay on node-local disk
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: downloads
spec:
  accessModes: ["ReadWriteMany"]
  resources:
    requests:
      storage: 200Gi
  storageClassName: ceph-filesystem
