---
# Same superheavy export as the other media apps; a PV binds to one claim, so each app gets its own
apiVersion: v1
kind: PersistentVolume
metadata:
  name: sabnzbd-superheavy-media
spec:
  accessModes: ["ReadWriteMany"]
  capacity:
    storage: 1Mi
  claimRef:
    name: sabnzbd-superheavy-media
    namespace: media
  # Explicit options override the nfsvers=3 server default in nfsmount.conf
  mountOptions: ["nfsvers=4.1", "hard", "noatime"]
  nfs:
    server: superheavy.internal
    path: /media
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sabnzbd-superheavy-media
spec:
  accessModes: ["ReadWriteMany"]
  resources:
    requests:
      storage: 1Mi
  storageClassName: ""
  volumeName: sabnzbd-superheavy-media
---
# Completed downloads, shared with Radarr/Sonarr (RWX); incomplete downloads stay on node-local disk
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: downloads
spec:
  accessModes: ["ReadWriteMany"]
  resources:
    requests:
      storage: 200Gi
  storageClassName: ceph-filesystem
