---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: radarr-cache
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 15Gi
  storageClassName: ceph-block
---
# Same superheavy export as the other media apps; a PV binds to one claim, so each app gets its own
apiVersion: v1
kind: PersistentVolume
metadata:
  name: radarr-superheavy-media
spec:
  accessModes: ["ReadWriteMany"]
  capacity:
    storage: 1Mi
  claimRef:
    name: radarr-superheavy-media
    namespace: media
  # superheavy only serves this export over NFSv3; overrides nfsvers=4.1 from nfsmount.conf
  mountOptions: ["nfsvers=3", "nolock", "tcp", "hard", "noatime"]
  nfs:
    server: superheavy.internal
    path: /volume/030ba2d3-244f-4673-bf9a-befbcba695ef/.srv/.unifi-drive/media/.data
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: radarr-superheavy-media
spec:
  accessModes: ["ReadWriteMany"]
  resources:
    requests:
      storage: 1Mi
  storageClassName: ""
  volumeName: radarr-superheavy-media
