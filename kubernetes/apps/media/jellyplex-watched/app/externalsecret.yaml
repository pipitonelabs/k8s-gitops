---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: jellyplex-watched
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: jellyplex-watched-secret
    template:
      data:
        # One-way sync: Jellyfin pushes watched state to Plex (TV and movies).
        # Flip DRYRUN to "False" once the logs look right.
        DRYRUN: "True"
        DEBUG_LEVEL: INFO
        RUN_ONLY_ONCE: "False"
        SLEEP_DURATION: "3600"
        LOG_FILE: /tmp/log.log
        MARK_FILE: /tmp/mark.log
        REQUEST_TIMEOUT: "300"
        MAX_THREADS: "1"
        GENERATE_GUIDS: "True"
        GENERATE_LOCATIONS: "True"
        USER_MAPPING: '{ "admin": "joepipitone" }'
        WHITELIST_USERS: "joepipitone, admin"
        LIBRARY_MAPPING: '{ "Shows": "TV Shows" }'
        PLEX_BASEURL: http://10.69.70.30:32400
        PLEX_TOKEN: "{{ .PLEX_TOKEN }}"
        SSL_BYPASS: "False"
        JELLYFIN_BASEURL: https://jellyfin.pipitonelabs.com
        JELLYFIN_TOKEN: "{{ .jellyfin_api_key }}"
        SYNC_FROM_PLEX_TO_JELLYFIN: "False"
        SYNC_FROM_PLEX_TO_PLEX: "False"
        SYNC_FROM_PLEX_TO_EMBY: "False"
        SYNC_FROM_JELLYFIN_TO_PLEX: "True"
        SYNC_FROM_JELLYFIN_TO_JELLYFIN: "False"
        SYNC_FROM_JELLYFIN_TO_EMBY: "False"
        SYNC_FROM_EMBY_TO_PLEX: "False"
        SYNC_FROM_EMBY_TO_JELLYFIN: "False"
        SYNC_FROM_EMBY_TO_EMBY: "False"
  data:
    - secretKey: PLEX_TOKEN
      remoteRef:
        key: plex
        property: PLEX_TOKEN
  dataFrom:
    - extract:
        key: jellyplex-watched
