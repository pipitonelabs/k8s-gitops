---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: jellyplex-watched
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: jellyplex-watched-secret
    template:
      data:
        config.yaml: |
          # One-way sync: Jellyfin pushes watched state to Plex (TV only).
          # Flip dryrun to false once the logs look right.
          dryrun: true
          debug_level: INFO
          run_only_once: false
          sleep_duration: 3600
          log_file: /tmp/log.log
          mark_file: /tmp/mark.log
          request_timeout: 300
          max_threads: 1
          generate_guids: true
          generate_locations: true

          blacklist_users: []
          whitelist_users: ["joepipitone", "admin"]
          blacklist_libraries: []
          whitelist_libraries: []
          blacklist_library_types: ["music", "photos"]
          whitelist_library_types: ["show", "tvshows"]

          plex:
            - name: plex-unraid
              baseurl: http://10.69.70.30:32400
              sync_to: []
              token: "{{ .PLEX_TOKEN }}"
              ssl_bypass: false

          jellyfin:
            - name: jellyfin-unraid
              baseurl: https://jellyfin.pipitonelabs.com
              sync_to: [plex-unraid]
              token: "{{ .jellyfin_api_key }}"

          user_mappings:
            - canonical: joepipitone
              aliases:
                - { server: plex-unraid, username: joepipitone }
                - { server: jellyfin-unraid, username: admin }
  data:
    - secretKey: PLEX_TOKEN
      remoteRef:
        key: plex
        property: PLEX_TOKEN
  dataFrom:
    - extract:
        key: jellyplex-watched
