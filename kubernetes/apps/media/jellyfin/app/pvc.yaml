---
# Same superheavy export as the other media apps; a PV binds to one claim, so Jellyfin gets its own
apiVersion: v1
kind: PersistentVolume
metadata:
  name: jellyfin-superheavy-media
spec:
  accessModes: ["ReadOnlyMany"]
  capacity:
    storage: 1Mi
  claimRef:
    name: jellyfin-superheavy-media
    namespace: media
  # superheavy only serves this export over NFSv3; overrides nfsvers=4.1 from nfsmount.conf
  mountOptions: ["nfsvers=3", "nolock", "tcp", "hard", "noatime"]
  nfs:
    server: superheavy.internal
    path: /volume/030ba2d3-244f-4673-bf9a-befbcba695ef/.srv/.unifi-drive/media/.data
    readOnly: true
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jellyfin-superheavy-media
spec:
  accessModes: ["ReadOnlyMany"]
  resources:
    requests:
      storage: 1Mi
  storageClassName: ""
  volumeName: jellyfin-superheavy-media
