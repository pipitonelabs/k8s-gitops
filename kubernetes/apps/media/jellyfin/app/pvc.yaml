---
# Same superheavy export as the other media apps; a PV binds to one claim, so Jellyfin gets its own
apiVersion: v1
kind: PersistentVolume
metadata:
  name: jellyfin-superheavy-media
spec:
  accessModes: ["ReadOnlyMany"]
  capacity:
    storage: 1Mi
  claimRef:
    name: jellyfin-superheavy-media
    namespace: media
  # Explicit options override the nfsvers=3 server default in nfsmount.conf
  mountOptions: ["nfsvers=4.1", "hard", "noatime"]
  nfs:
    server: superheavy.internal
    path: /media
    readOnly: true
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jellyfin-superheavy-media
spec:
  accessModes: ["ReadOnlyMany"]
  resources:
    requests:
      storage: 1Mi
  storageClassName: ""
  volumeName: jellyfin-superheavy-media
