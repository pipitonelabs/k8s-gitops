---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: graph-mock
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  interval: 1h
  values:
    controllers:
      graph-mock:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: docker.io/denoland/deno
              tag: alpine-2.9.7@sha256:8ce780168429c4bf5962652e6cbea3fd45254ae902069e90585fb33f74c56968
            args:
              - run
              - --allow-net
              - --allow-env
              - /app/server.ts
            env:
              DENO_DIR: /tmp/deno
              PORT: &port 8080
              PROVISION_DELAY_SECONDS: "20"
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: *port
                  initialDelaySeconds: 10
                  periodSeconds: 10
                  timeoutSeconds: 3
                  failureThreshold: 3
              readiness: *probes
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 256Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 568
        runAsGroup: 568
    persistence:
      server:
        type: configMap
        name: graph-mock-server
        globalMounts:
          - path: /app/server.ts
            subPath: server.ts
            readOnly: true
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
    route:
      app:
        hostnames:
          - "{{ .Release.Name }}.pipitonelabs.com"
        parentRefs:
          - name: envoy-external
            namespace: networking
        rules:
          # Only the Graph/token surface is public; /__reset stays cluster-internal.
          - matches:
              - path:
                  type: PathPrefix
                  value: /v1.0
              - path:
                  type: RegularExpression
                  value: /[^/]+/oauth2/v2\.0/token
            backendRefs:
              - identifier: app
                port: *port
    service:
      app:
        ports:
          http:
            port: *port
