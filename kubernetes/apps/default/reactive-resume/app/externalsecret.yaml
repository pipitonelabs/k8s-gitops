---
# yaml-language-server: $schema=https://kube-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# App-layer secrets for Reactive Resume. DATABASE_URL comes from
# reactiveresume-pguser-secret (generated by the cnpg component); non-secret
# env is set inline on the HelmRelease.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &app reactive-resume
  namespace: default
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: reactive-resume-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      metadata:
        annotations:
          reloader.stakater.com/auto: "true"
      data:
        # 32+ char random string used to sign auth tokens.
        AUTH_SECRET: "{{ .AUTH_SECRET }}"
        # Garage S3 credentials with read/write on the reactive-resume bucket.
        S3_ACCESS_KEY_ID: "{{ .S3_ACCESS_KEY_ID }}"
        S3_SECRET_ACCESS_KEY: "{{ .S3_SECRET_ACCESS_KEY }}"
  dataFrom:
    - extract:
        key: *app
