---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app reactive-resume
  namespace: &namespace default
spec:
  targetNamespace: *namespace
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: cloudnative-pg-cluster
      namespace: database
    - name: onepassword-store
      namespace: external-secrets
    - name: garage
      namespace: default
  components:
    - ../../../../components/cnpg
  path: ./kubernetes/apps/default/reactive-resume/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: false
  interval: 1h
  retryInterval: 2m
  timeout: 5m
  postBuild:
    substitute:
      # APP drives the cnpg component's DB name, role, and secret names.
      # Deliberately hyphen-free: the component references it as a Go-template
      # field key ({{ .${APP}_postgres_username }}) in the cloudnative-pg
      # 1Password item, and a hyphen there is a template parse error. The
      # HelmRelease, route, and this Kustomization stay "reactive-resume".
      APP: reactiveresume
      CNPG_NAME: postgres17
