---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: forgejo
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  interval: 1h
  values:
    controllers:
      forgejo:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: codeberg.org/forgejo/forgejo
              tag: 17.0.1-rootless@sha256:5ef02fbcf22beef56b8c844952ffad58cfe177b6f98e46e6abb5df90b88dc8d3
            env:
              TZ: America/New_York
              FORGEJO__database__DB_TYPE: sqlite3
              FORGEJO__server__DOMAIN: &host git.pipitonelabs.com
              FORGEJO__server__ROOT_URL: https://git.pipitonelabs.com/
              FORGEJO__server__SSH_DOMAIN: &sshHost ssh.git.pipitonelabs.com
              FORGEJO__server__SSH_PORT: "22"
              FORGEJO__server__SSH_LISTEN_PORT: &sshPort 2222
              FORGEJO__server__START_SSH_SERVER: "true"
              FORGEJO__server__HTTP_PORT: &port 3000
              # Secret keys auto-generate into $GITEA_APP_INI (/var/lib/gitea/custom/conf/app.ini) on first boot
              FORGEJO__security__INSTALL_LOCK: "true"
              FORGEJO__service__DISABLE_REGISTRATION: "true"
              FORGEJO__metrics__ENABLED: "true"
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/healthz
                    port: *port
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 3
                  failureThreshold: 3
              readiness: *probes
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/healthz
                    port: *port
                  periodSeconds: 10
                  timeoutSeconds: 3
                  failureThreshold: 30
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                memory: 1Gi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
    defaultPodOptions:
      hostUsers: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    persistence:
      data:
        existingClaim: "{{ .Release.Name }}"
        advancedMounts:
          forgejo:
            app:
              - path: /var/lib/gitea
      tmpfs:
        type: emptyDir
        advancedMounts:
          forgejo:
            app:
              - path: /tmp
    route:
      app:
        annotations:
          gatus.home-operations.com/endpoint: |-
            url: https://git.pipitonelabs.com/api/healthz
            group: default
        hostnames:
          - *host
        parentRefs:
          - name: envoy-internal
            namespace: networking
        rules:
          - backendRefs:
              - identifier: app
                port: *port
    service:
      app:
        controller: forgejo
        primary: true
        ports:
          http:
            port: *port
      ssh:
        type: LoadBalancer
        controller: forgejo
        annotations:
          external-dns.alpha.kubernetes.io/hostname: *sshHost
          lbipam.cilium.io/ips: 192.168.20.86
        ports:
          ssh:
            port: 22
            targetPort: *sshPort
    serviceMonitor:
      app:
        serviceName: "{{ .Release.Name }}-app"
        endpoints:
          - port: http
            path: /metrics
