---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: default
components:
  - ../../components/namespace
patches:
  - target:
      kind: Namespace
    patch: |-
      apiVersion: v1
      kind: Namespace
      metadata:
        name: not-used
        labels:
          # routes in this namespace may attach to envoy-external (public)
          gateway.pipitonelabs.com/external: "true"
resources:
  - ./blog/ks.yaml
  - ./garage/ks.yaml
  - ./minecraft/ks.yaml
  - ./outline/ks.yaml
  - ./reactive-resume/ks.yaml
  - ./smtp-relay/ks.yaml
  - ./nginx/ks.yaml
  - ./graph-mock/ks.yaml
  - ./forgejo/ks.yaml
  - ./forgejo-test-app/ks.yaml
