---
# Garage metadata (LMDB) must live on block storage: LMDB on NFS corrupted the DB on 2026-11-02.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: garage-meta
  labels:
    # dataSourceRef is immutable, so Flux only creates this PVC and never patches it. On a new cluster it
    # restores from VolSync. To resize it, patch the live PVC as well as this file.
    kustomize.toolkit.fluxcd.io/ssa: IfNotPresent
spec:
  accessModes: ["ReadWriteOnce"]
  dataSourceRef:
    kind: ReplicationDestination
    apiGroup: volsync.backube
    name: garage-meta-dst
  resources:
    requests:
      storage: 5Gi
  storageClassName: ceph-block
---
# Garage object data on superheavy over NFSv4.1 (static PV so it can set mount options)
apiVersion: v1
kind: PersistentVolume
metadata:
  name: garage-superheavy-data
spec:
  accessModes: ["ReadWriteMany"]
  capacity:
    storage: 1Mi
  claimRef:
    name: garage-superheavy-data
    namespace: default
  # Explicit options override the nfsvers=3 server default in nfsmount.conf
  mountOptions: ["nfsvers=4.1", "hard", "noatime"]
  nfs:
    server: superheavy.internal
    path: /kubernetes/garage/data
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: garage-superheavy-data
spec:
  accessModes: ["ReadWriteMany"]
  resources:
    requests:
      storage: 1Mi
  storageClassName: ""
  volumeName: garage-superheavy-data
