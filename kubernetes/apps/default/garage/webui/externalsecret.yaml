---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: garage-webui-oidc
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: garage-webui-oidc
    template:
      engineVersion: v2
      data:
        client-secret: "{{ .GARAGE_OIDC_CLIENT_SECRET }}"
  data:
    - secretKey: GARAGE_OIDC_CLIENT_SECRET
      remoteRef:
        key: garage
        property: GARAGE_OIDC_CLIENT_SECRET
