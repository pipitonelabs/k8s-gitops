---
# yaml-language-server: $schema=https://kube-schemas.pages.dev/gateway.envoyproxy.io/securitypolicy_v1alpha1.json
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: garage-webui
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: garage-webui
  oidc:
    provider:
      issuer: https://sso.pipitonelabs.com/application/o/garage/
    clientID: garage
    clientSecret:
      name: garage-webui-oidc
    redirectURL: https://garage.pipitonelabs.com/oauth2/callback
    logoutPath: /oauth2/logout
    scopes: [openid, email, profile]
