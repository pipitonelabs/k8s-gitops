---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app taskview
  namespace: &namespace default
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  maxHistory: 2
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  uninstall:
    keepHistory: false
  values:
    controllers:
      api:
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          # Creates the "taskview" database and role on the shared postgres17
          # cluster using the superuser creds from the cnpg component.
          01-init-db:
            image:
              repository: ghcr.io/home-operations/postgres-init
              tag: "19"
            envFrom:
              - secretRef:
                  name: taskview-initdb-secret
          # One-shot migration runner: waits for Postgres, then applies
          # schema migrations (--create on an empty DB). Images are built
          # from source in pipitonelabs/taskview.
          02-migrate:
            image:
              repository: ghcr.io/pipitonelabs/taskview-migration
              # Digest-pinned: Spegel serves the mutable `latest` tag from peer
              # cache, so a bare `latest` won't pull new builds. Renovate bumps
              # the digest on each new image.
              tag: latest@sha256:5e5ccde281f43375f9746fef779e61067138ee04d07b449b10d9b577ec0e9cfc
            env: &dbEnv
              DB_HOST:
                valueFrom:
                  secretKeyRef: { name: taskview-pguser-secret, key: host }
              DB_PORT:
                valueFrom:
                  secretKeyRef: { name: taskview-pguser-secret, key: port }
              DB_NAME:
                valueFrom:
                  secretKeyRef: { name: taskview-pguser-secret, key: db }
              DB_USER:
                valueFrom:
                  secretKeyRef: { name: taskview-pguser-secret, key: user }
              DB_PASSWORD:
                valueFrom:
                  secretKeyRef: { name: taskview-pguser-secret, key: password }
            securityContext: &securityContext
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
        containers:
          app:
            image:
              repository: ghcr.io/pipitonelabs/taskview-api
              # Digest-pinned: Spegel serves the mutable `latest` tag from peer
              # cache, so a bare `latest` won't pull new builds. Renovate bumps
              # the digest on each new image.
              tag: latest@sha256:385d42c11fa1631b9f2ec106923f65f883be4eccf67b2f228b6f34a4810a1f9e
            env:
              <<: *dbEnv
              TZ: America/New_York
              APP_PORT: "1401"
              # Documented as optional, but the API's env schema requires
              # them and refuses to start without. Values are the documented
              # defaults.
              JWT_ALG: HS256
              ACCESS_LIFE_TIME: 1d
              REFRESH_LIFE_TIME: 2d
              # npm (cache/logs) and pm2-runtime (~/.pm2) write under $HOME;
              # the root filesystem is read-only.
              HOME: /tmp
              # 2 workers x 10 pool = 20 connections on the shared cluster.
              PM2_INSTANCES: "2"
              DB_POOL_MAX: "10"
              # Web and API share one origin: the route below sends /module,
              # /scim and /.well-known to the API. Upstream builds links such
              # as the email-confirmation URL as APP_URL + /module/..., so the
              # API must be reachable under the web host.
              APP_URL: &url https://taskview.pipitonelabs.com
              API_PUBLIC_URL: *url
              CORS_ALLOWED_ORIGINS: *url
              # Single hop: Envoy Gateway.
              TRUST_PROXY: "1"
              # Sign-in: Authentik (OIDC, configured in the org's SSO settings),
              # email code, and password. Social providers are not configured.
              AUTH_LOGIN_METHODS: magic-link,password,sso
              # Authentik resolves to a private address from inside the
              # cluster, and the domain is ours, so skip the public
              # DNS/HTTP ownership proof.
              SSO_ALLOW_PRIVATE_URLS: "true"
              SSO_TRUSTED_DOMAINS: pipitonelabs.com
              # Invite-only. The admin account is upstream's seeded default
              # user, claimed via Account settings; Authentik (SSO) still
              # provisions pipitonelabs.com users on first sign-in.
              ALLOW_PUBLIC_REGISTRATION: "false"
              # Mail via the in-cluster relay (unauthenticated, plaintext).
              SMTP_HOST: smtp-relay.default.svc.cluster.local
              SMTP_PORT: "2525"
              SMTP_ENCRYPTION: none
              SMTP_FROM_NAME: TaskView
              SMTP_FROM_EMAIL: taskview@pipitonelabs.com
              # Task attachments on the volsync-backed PVC.
              FILE_STORAGE_PROVIDER: local
              FILE_STORAGE_LOCAL_DIR: /usr/src/app/data/files
            envFrom:
              - secretRef:
                  name: taskview-secret
            probes:
              # No unauthenticated health endpoint; a TCP check on the
              # listener is the most the API exposes.
              liveness: &tcpProbe
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 1401
                  initialDelaySeconds: 0
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *tcpProbe
              startup:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 1401
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 30
            securityContext: *securityContext
            resources:
              requests:
                cpu: 10m
                memory: 256Mi
              limits:
                memory: 2Gi
      web:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/pipitonelabs/taskview-web
              # Digest-pinned: Spegel serves the mutable `latest` tag from peer
              # cache, so a bare `latest` won't pull new builds. Renovate bumps
              # the digest on each new image.
              tag: latest@sha256:3ed20e8ebfda4823bad6edc9a5d99b0455c3b0cba0d35646a1fba0765dd421f8
            # TASKVIEW_API_URL is deliberately unset: the image's entrypoint
            # would write config.js into the (read-only) web root. The same
            # file is mounted from the ConfigMap below instead.
            probes:
              liveness: &webProbe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: &webPort 8080
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *webProbe
            securityContext: *securityContext
            resources:
              requests:
                cpu: 5m
                memory: 16Mi
              limits:
                memory: 128Mi
    defaultPodOptions:
      imagePullSecrets:
        - name: ghcr-login
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
    configMaps:
      web:
        data:
          # Upstream nginx.conf, moved to an unprivileged port.
          default.conf: |
            server {
                listen 8080;
                server_name _;
                root /usr/share/nginx/html;
                index index.html;
                gzip on;
                gzip_vary on;
                gzip_min_length 1024;
                gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/json application/javascript;
                add_header X-Frame-Options "SAMEORIGIN" always;
                add_header X-Content-Type-Options "nosniff" always;
                location / {
                    try_files $uri $uri/ /index.html;
                }
                location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
                    expires 1y;
                    add_header Cache-Control "public, immutable";
                }
                location = /index.html {
                    add_header Cache-Control "no-cache, no-store, must-revalidate";
                }
                location = /config.js {
                    add_header Cache-Control "no-cache, no-store, must-revalidate";
                }
                error_page 404 /index.html;
            }
          # Pins the web app to this API (same origin) and hides the server
          # picker.
          config.js: |
            window.__TASKVIEW_CONFIG__ = { apiUrl: "https://taskview.pipitonelabs.com" };
    service:
      api:
        controller: api
        ports:
          http:
            port: 1401
      web:
        controller: web
        ports:
          http:
            port: *webPort
    persistence:
      files:
        existingClaim: *app
        advancedMounts:
          api:
            app:
              - path: /usr/src/app/data/files
      api-scratch:
        type: emptyDir
        advancedMounts:
          api:
            02-migrate:
              - path: /tmp
                subPath: tmp
            app:
              - path: /tmp
                subPath: tmp
              - path: /usr/src/app/logs
                subPath: logs
      web-config:
        type: configMap
        identifier: web
        advancedMounts:
          web:
            app:
              - path: /etc/nginx/conf.d/default.conf
                subPath: default.conf
                readOnly: true
              - path: /usr/share/nginx/html/config.js
                subPath: config.js
                readOnly: true
      web-scratch:
        type: emptyDir
        advancedMounts:
          web:
            app:
              - path: /var/cache/nginx
                subPath: cache
              - path: /run
                subPath: run
              - path: /tmp
                subPath: tmp
    route:
      app:
        annotations:
          # The sidecar derives the URL from the first rule (/module, the
          # API prefix, which 404s). Probe an unauthenticated API endpoint
          # instead so the check covers the API, not just the static web pod.
          gatus.home-operations.com/endpoint: |-
            group: default
            url: https://taskview.pipitonelabs.com/module/auth/login-options
        hostnames:
          - taskview.pipitonelabs.com
        parentRefs:
          - name: envoy-internal
            namespace: networking
        rules:
          # API paths (REST, SCIM, OAuth discovery for MCP clients).
          - matches:
              - path: { type: PathPrefix, value: /module }
              - path: { type: PathPrefix, value: /scim }
              - path: { type: PathPrefix, value: /.well-known }
            backendRefs:
              - identifier: api
                port: 1401
          - backendRefs:
              - identifier: web
                port: *webPort
