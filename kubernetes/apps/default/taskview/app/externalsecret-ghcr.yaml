---
# yaml-language-server: $schema=https://kube-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# GHCR pull secret for the private TaskView images. Reuses the existing
# pipitonelabs org PAT (same one the budget pull secret uses).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: taskview-ghcr-login
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: taskview-ghcr-login
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {"auths":{"ghcr.io":{"username":"pipitonelabs","password":"{{ .budget_github_pat }}","auth":"{{ printf "pipitonelabs:%s" .budget_github_pat | b64enc }}"}}}
  data:
    - secretKey: budget_github_pat
      remoteRef:
        key: budget
        property: budget_github_pat
