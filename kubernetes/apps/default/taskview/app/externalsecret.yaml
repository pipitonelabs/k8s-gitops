---
# yaml-language-server: $schema=https://kube-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# App-layer secrets for TaskView. DB credentials come from
# taskview-pguser-secret (generated by the cnpg component); non-secret env is
# set inline on the HelmRelease.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &app taskview
  namespace: default
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: taskview-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      metadata:
        annotations:
          reloader.stakater.com/auto: "true"
      data:
        # Long random string used to sign JWTs.
        JWT_SIGN: "{{ .JWT_SIGN }}"
        # 64-char hex (32 bytes). Encrypts SSO/integration secrets at rest;
        # losing it makes those unreadable.
        ENCRYPTION_KEY: "{{ .ENCRYPTION_KEY }}"
  dataFrom:
    - extract:
        key: *app
