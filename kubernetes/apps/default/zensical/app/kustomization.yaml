---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./helmrelease.yaml
configMapGenerator:
  - name: zensical-config
    files:
      - ./resources/zensical.toml
      - ./resources/nginx.conf
generatorOptions:
  disableNameSuffixHash: true
