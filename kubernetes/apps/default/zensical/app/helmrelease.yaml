---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: zensical
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  interval: 1h
  values:
    controllers:
      zensical:
        annotations:
          reloader.stakater.com/auto: "true"
        # A failed build never becomes Ready, so the previous site keeps serving.
        strategy: RollingUpdate
        initContainers:
          build:
            image:
              repository: docker.io/zensical/zensical
              tag: 0.1.4@sha256:864dd487a93dc06ff911a5ae600d255a0ad1251e8facad84382130ae28509b4d
            command:
              - /bin/sh
              - -ec
              - |
                cd /work
                rm -rf docs
                mkdir -p docs/assets
                cp /src/config/zensical.toml zensical.toml
                cp /src/docs/*.md /src/docs/*.conf docs/
                cp /src/docs/*.svg docs/assets/
                zensical build --clean --strict
            env:
              HOME: /tmp
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                memory: 512Mi
            securityContext: &securityContext
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
        containers:
          app:
            image:
              repository: docker.io/nginxinc/nginx-unprivileged
              tag: 1.31.7-alpine@sha256:b5047b9b76845eac124358373c6852377c52e4b05834a47647e955dd91cb8f1e
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: &port 8080
                  periodSeconds: 10
                  timeoutSeconds: 2
                  failureThreshold: 3
              readiness: *probes
            resources:
              requests:
                cpu: 10m
                memory: 16Mi
              limits:
                memory: 64Mi
            securityContext: *securityContext
    defaultPodOptions:
      automountServiceAccountToken: false
      hostUsers: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
    persistence:
      config:
        type: configMap
        name: zensical-config
        advancedMounts:
          zensical:
            build:
              - path: /src/config
                readOnly: true
            app:
              - path: /etc/nginx/conf.d/default.conf
                subPath: nginx.conf
                readOnly: true
      docs:
        type: configMap
        name: zensical-pages
        advancedMounts:
          zensical:
            build:
              - path: /src/docs
                readOnly: true
      work:
        type: emptyDir
        advancedMounts:
          zensical:
            build:
              - path: /work
            app:
              - path: /work
                readOnly: true
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
    route:
      app:
        annotations:
          gatus.home-operations.com/endpoint: |-
            group: default
        hostnames:
          - docs.pipitonelabs.com
        parentRefs:
          - name: envoy-internal
            namespace: networking
    service:
      app:
        ports:
          http:
            port: *port
