---
# Holds /etc/gitlab (config + gitlab-secrets.json) and /var/opt/gitlab (repos, bundled postgres/redis, registry images)
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gitlab
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 50Gi
  storageClassName: ceph-block
