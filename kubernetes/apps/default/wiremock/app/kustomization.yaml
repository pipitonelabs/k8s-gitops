---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./helmrelease.yaml
configMapGenerator:
  - name: wiremock-mappings
    files:
      - ./resources/mappings/token.json
      - ./resources/mappings/subscribed-skus.json
      - ./resources/mappings/users.json
generatorOptions:
  disableNameSuffixHash: true
