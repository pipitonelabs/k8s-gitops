---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: offsite-backup
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: offsite-backup-secret
    template:
      data:
        OFFSITE_PROVIDER: "{{ .OFFSITE_PROVIDER }}"
        # host only (no scheme): Kopia requires it, the script adds https:// for rclone
        OFFSITE_ENDPOINT: '{{ .OFFSITE_ENDPOINT | trimPrefix "https://" | trimPrefix "http://" | trimSuffix "/" }}'
        OFFSITE_REGION: "{{ .OFFSITE_REGION }}"
        OFFSITE_BUCKET: "{{ .OFFSITE_BUCKET }}"
        OFFSITE_ACCESS_KEY_ID: "{{ .OFFSITE_ACCESS_KEY_ID }}"
        OFFSITE_SECRET_ACCESS_KEY: "{{ .OFFSITE_SECRET_ACCESS_KEY }}"
        RCLONE_CRYPT_PASSWORD: "{{ .RCLONE_CRYPT_PASSWORD }}"
        RCLONE_CRYPT_SALT: "{{ .RCLONE_CRYPT_SALT }}"
        GARAGE_ACCESS_KEY_ID: "{{ .GARAGE_ACCESS_KEY_ID }}"
        GARAGE_SECRET_ACCESS_KEY: "{{ .GARAGE_SECRET_ACCESS_KEY }}"
        KOPIA_PASSWORD: "{{ .KOPIA_PASSWORD }}"
  data:
    - secretKey: KOPIA_PASSWORD
      remoteRef:
        key: volsync-template
        property: KOPIA_PASSWORD
  dataFrom:
    - extract:
        key: offsite-backup
