---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/volsync.backube/kopiamaintenance_v1alpha1.json
apiVersion: volsync.backube/v1alpha1
kind: KopiaMaintenance
metadata:
  name: daily
  namespace: volsync
spec:
  enabled: true
  trigger:
    # Every 6h, so index epochs advance and compact often enough. Pairs with the repository's
    # minimum epoch duration of 4h. Once a day leaves thousands of index blobs uncompacted.
    schedule: 30 */6 * * *
  repository:
    repository: volsync-maintenance-secret
  moverVolumes:
    - mountPath: repository
      volumeSource:
        nfs:
          server: superheavy.internal
          path: /var/nfs/shared/volsync
