                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 93600
                  },
                  {
                    "color": "red",
                    "value": 108000
                  }
                ]
              }
            },
            "overrides": []
