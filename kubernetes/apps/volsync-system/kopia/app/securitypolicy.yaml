---
# yaml-language-server: $schema=https://kube-schemas.pages.dev/gateway.envoyproxy.io/securitypolicy_v1alpha1.json
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: kopia
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: kopia
  oidc:
    provider:
      issuer: https://sso.pipitonelabs.com/application/o/kopia
    clientID: kopia
    clientSecret:
      name: kopia-oidc
    redirectURL: https://kopia.pipitonelabs.com/oauth2/callback
    logoutPath: /oauth2/logout
    scopes: [openid, email, profile]
