---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/admissionregistration.k8s.io/validatingadmissionpolicy_v1.json
# Guardrail for the unrestricted `onepassword` ClusterSecretStore: sensitive 1Password
# items may only be referenced from the namespaces listed in `allow` below.
# Items not listed in `allow` are unrestricted (app-specific items).
# `flux` is deliberately NOT listed: components/namespace/alerts copies it into every namespace.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: onepassword-item-allowlist
spec:
  failurePolicy: Fail
  matchConstraints:
    matchPolicy: Equivalent
    resourceRules:
      - apiGroups: ["external-secrets.io"]
        apiVersions: ["*"]
        operations: ["CREATE", "UPDATE"]
        resources: ["externalsecrets", "clusterexternalsecrets", "pushsecrets"]
  variables:
    # item (lowercase 1Password title) -> namespaces allowed to reference it ('-' = nobody)
    - name: allow
      expression: >-
        {
          'talos': ['-'],
          '1password': ['-'],
          'onepassword': ['-'],
          'cloudflare': ['cert-manager', 'database', 'networking'],
          'cloudnative-pg': ['budget', 'database', 'default', 'home', 'observability', 'security', 'tradeforge'],
          'volsync-template': ['default', 'home', 'media', 'networking', 'observability', 'volsync-system'],
          'tailscale': ['networking'],
          'pipitonelabs-com-tls': ['networking'],
          'authentik': ['security'],
          'actions-runner': ['actions-runner-system'],
          'unifi': ['networking', 'observability'],
          'sing-box': ['networking']
        }
    # ClusterExternalSecret nests the ExternalSecret spec; its namespace is '' so it never matches an allowlist
    - name: spec
      expression: >-
        has(object.spec.externalSecretSpec) ? object.spec.externalSecretSpec : object.spec
    # every 1Password key referenced: data[].remoteRef.key, dataFrom[].extract.key, PushSecret match.remoteRef.remoteKey
    - name: keys
      expression: >-
        (has(variables.spec.data) ?
          variables.spec.data.filter(d, has(d.remoteRef) && has(d.remoteRef.key)).map(d, string(d.remoteRef.key)) +
          variables.spec.data.filter(d, has(d.match) && has(d.match.remoteRef) && has(d.match.remoteRef.remoteKey)).map(d, string(d.match.remoteRef.remoteKey))
          : []) +
        (has(variables.spec.dataFrom) ?
          variables.spec.dataFrom.filter(d, has(d.extract) && has(d.extract.key)).map(d, string(d.extract.key))
          : [])
    # keys may be `item`, `item/field` or `item/section/field`: the item is the first segment
    - name: items
      expression: >-
        variables.keys.map(k, k.trim().lowerAscii().split('/')[0])
    - name: ns
      expression: >-
        has(object.metadata.namespace) ? object.metadata.namespace : ''
  validations:
    - expression: >-
        variables.items.all(i, !(i in variables.allow) ||
          variables.allow[i].exists(n, n == variables.ns))
      messageExpression: >-
        'namespace "' + variables.ns + '" may not reference 1Password item(s): ' +
        variables.items.filter(i, i in variables.allow &&
          !variables.allow[i].exists(n, n == variables.ns)).join(', ')
      reason: Forbidden
    # an item referenced by its 26-char 1Password ID would bypass the name allowlist
    - expression: >-
        variables.items.all(i, !i.matches('^[a-z0-9]{26}$'))
      message: Referencing 1Password items by ID is not allowed; use the item title
      reason: Forbidden
    # `find` could enumerate items by name regex
    - expression: >-
        !has(variables.spec.dataFrom) || !variables.spec.dataFrom.exists(d, has(d.find))
      message: dataFrom.find is not allowed; use dataFrom.extract with an explicit item
      reason: Forbidden
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/admissionregistration.k8s.io/validatingadmissionpolicybinding_v1.json
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: onepassword-item-allowlist
spec:
  policyName: onepassword-item-allowlist
  validationActions: ["Deny"]
