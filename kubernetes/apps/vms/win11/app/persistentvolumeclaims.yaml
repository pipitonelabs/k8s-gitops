---
# The Windows install. Bound to its existing RBD volume, carried over from the default namespace.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: win11-disk
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  accessModes:
    - ReadWriteMany  # live migration
  volumeMode: Block
  storageClassName: ceph-block
  volumeName: pvc-c1ff5b83-bdf5-4c00-81b2-9094252ea133
  resources:
    requests:
      storage: 100Gi
---
# The persistent TPM state PVC is not managed here. KubeVirt finds it by the persistent-state-for=win11 label and
# replaces it with a new, randomly suffixed PVC on every live migration (the volume is RWO), so a fixed name and
# volumeName in git goes stale after the first migration.
