---
# yaml-language-server: $schema=https://kube-schemas.pages.dev/gateway.networking.k8s.io/httproute_v1.json
# Internal-only route for the SPA + supabase-js paths (web/rest/realtime).
# TLS via the shared *.pipitonelabs.com wildcard cert on envoy-internal;
# external-dns auto-creates the internal DNS record for this host.
# The reporter path (Sierra Chart -> swappybot-reporter) stays public; see
# httproute-reporter.yaml on envoy-external, same hostname, split by path.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: tradeforge
spec:
  hostnames: ["tradeforge.pipitonelabs.com"]
  parentRefs:
    - name: envoy-internal
      namespace: networking
  rules:
    # PostgREST serves at root; strip the /rest/v1 prefix.
    - matches:
        - path: { type: PathPrefix, value: /rest/v1 }
      filters:
        - type: URLRewrite
          urlRewrite:
            path: { type: ReplacePrefixMatch, replacePrefixMatch: / }
      backendRefs:
        - name: tradeforge-postgrest
          port: 3000
    # Realtime (Phoenix) serves the socket at /socket; map /realtime/v1 -> /socket.
    # VALIDATE at cutover: confirm the WS connects (devtools -> WS).
    - matches:
        - path: { type: PathPrefix, value: /realtime/v1 }
      filters:
        - type: URLRewrite
          urlRewrite:
            path: { type: ReplacePrefixMatch, replacePrefixMatch: /socket }
      backendRefs:
        - name: tradeforge-realtime
          port: 4000
    # Everything else -> the SPA.
    - matches:
        - path: { type: PathPrefix, value: / }
      backendRefs:
        - name: tradeforge-web
          port: 8080
