---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: observability
components:
  - ../../components/namespace
patches:
  - target:
      kind: Namespace
    patch: |-
      apiVersion: v1
      kind: Namespace
      metadata:
        name: not-used
        labels:
          # routes in this namespace may attach to envoy-external (public)
          gateway.pipitonelabs.com/external: "true"
          # node-exporter (hostPID/hostPath), smartctl-exporter (privileged), blackbox/gatus NET_RAW, log collector hostPath
          pod-security.kubernetes.io/enforce: privileged
resources:
  - ./blackbox-exporter/ks.yaml
  - ./gatus/ks.yaml
  - ./grafana/ks.yaml
  - ./karma/ks.yaml
  - ./keda/ks.yaml
  - ./kromgo/ks.yaml
  - ./kube-prometheus-stack/ks.yaml
  - ./silence-operator/ks.yaml
  - ./smartctl-exporter/ks.yaml
#  - ./snmp-exporter/ks.yaml
  - ./unpoller/ks.yaml
  - ./victoria-logs/ks.yaml
