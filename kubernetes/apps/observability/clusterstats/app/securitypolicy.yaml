---
# yaml-language-server: $schema=https://kube-schemas.pages.dev/gateway.envoyproxy.io/securitypolicy_v1alpha1.json
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: clusterstats
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: clusterstats
  oidc:
    provider:
      issuer: https://sso.pipitonelabs.com/application/o/ops-tools
    clientID: ops-tools
    clientSecret:
      name: ops-tools-oidc
    redirectURL: https://cluster.pipitonelabs.com/oauth2/callback
    logoutPath: /oauth2/logout
    cookieNames:
      accessToken: AccessToken-clusterstats
      idToken: IdToken-clusterstats
    scopes: [openid, email, profile]
