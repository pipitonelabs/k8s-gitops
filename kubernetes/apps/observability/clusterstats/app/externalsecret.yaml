---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# API keys for the Now streaming section; nginx adds them to the upstream request so they never reach the browser.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: clusterstats
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: clusterstats-secret
    template:
      data:
        TAUTULLI_API_KEY: "{{ .TAUTULLI_API_KEY }}"
        JELLYFIN_API_KEY: "{{ .JELLYFIN_API_KEY }}"
  dataFrom:
    - extract:
        key: tautulli
    - extract:
        key: cluster-stats
