---
# yaml-language-server: $schema=https://kube-schemas.pages.dev/gateway.envoyproxy.io/securitypolicy_v1alpha1.json
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: prometheus
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: kube-prometheus-stack-prometheus
  oidc:
    provider:
      issuer: https://sso.pipitonelabs.com/application/o/ops-tools
      # Static endpoints so the controller never needs the discovery document: a slow Authentik during a
      # reconcile otherwise sets a 500 direct response on every OIDC route (Gatus blip, 2026-11-06).
      authorizationEndpoint: https://sso.pipitonelabs.com/application/o/authorize/
      tokenEndpoint: https://sso.pipitonelabs.com/application/o/token/
    clientID: ops-tools
    clientSecret:
      name: ops-tools-oidc
    redirectURL: https://prometheus.pipitonelabs.com/oauth2/callback
    logoutPath: /oauth2/logout
    cookieNames:
      accessToken: AccessToken-prometheus
      idToken: IdToken-prometheus
    # Background fetch/XHR (Sec-Fetch-Dest: empty) gets a 401 instead of a login redirect. Each redirect
    # sets per-flow OauthNonce/CodeVerifier cookies on /oauth2/callback; a polling dashboard piles up
    # 100+ of them and the callback then exceeds Envoy's HTTP/2 header count (ERR_HTTP2_PROTOCOL_ERROR).
    denyRedirect:
      headers:
        - name: Sec-Fetch-Dest
          type: Exact
          value: empty
    scopes: [openid, email, profile]
---
# yaml-language-server: $schema=https://kube-schemas.pages.dev/gateway.envoyproxy.io/securitypolicy_v1alpha1.json
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
