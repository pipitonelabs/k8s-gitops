---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gitlab-runner
spec:
  chart:
    spec:
      chart: gitlab-runner
      version: 0.95.1
      sourceRef:
        kind: HelmRepository
        name: gitlab
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  interval: 1h
  values:
    gitlabUrl: https://gitlab.pipitonelabs.com
    concurrent: 4
    checkInterval: 5
    # Deletes only this runner manager on shutdown; the runner created in the UI stays
    unregisterRunners: true
    serviceAccount:
      create: true
    rbac:
      create: true
      # Minimal permissions for the Kubernetes executor
      # https://docs.gitlab.com/runner/executors/kubernetes/#configure-runner-api-permissions
      rules:
        - resources: ["pods"]
          verbs: ["create", "delete", "get", "list", "watch"]
        - resources: ["pods/attach", "pods/exec"]
          verbs: ["create", "delete", "get", "patch"]
        - resources: ["pods/log"]
          verbs: ["get", "list"]
        - resources: ["secrets", "configmaps"]
          verbs: ["create", "delete", "get", "update"]
        - resources: ["serviceaccounts"]
          verbs: ["get"]
        - resources: ["services"]
          verbs: ["create", "get"]
        - resources: ["events"]
          verbs: ["list", "watch"]
    runners:
      secret: gitlab-runner-secret
      config: |
        [[runners]]
          [runners.kubernetes]
            namespace = "{{ .Release.Namespace }}"
            image = "alpine:3"
            poll_timeout = 600
            cpu_request = "100m"
            memory_request = "256Mi"
            memory_limit = "4Gi"
            helper_memory_limit = "512Mi"
            service_memory_limit = "1Gi"
            [runners.kubernetes.pod_labels]
              "gitlab-runner/job" = "true"
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 256Mi
