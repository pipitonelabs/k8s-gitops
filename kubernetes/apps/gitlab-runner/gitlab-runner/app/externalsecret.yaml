---
# yaml-language-server: $schema=https://kube-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# Runner authentication token (glrt-...) from Admin > CI/CD > Runners > New instance runner.
# The chart mounts both keys; registration tokens are removed in GitLab 18+, so that one stays empty.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gitlab-runner-secret
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: gitlab-runner-secret
    creationPolicy: Owner
    template:
      data:
        runner-token: "{{ .GITLAB_RUNNER_TOKEN }}"
        runner-registration-token: ""
  data:
    - secretKey: GITLAB_RUNNER_TOKEN
      remoteRef:
        key: gitlab
        property: GITLAB_RUNNER_TOKEN
