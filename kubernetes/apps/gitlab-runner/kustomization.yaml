---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: gitlab-runner
components:
  - ../../components/namespace
patches:
  # Job pods run with seccomp Unconfined (rootless BuildKit), which baseline rejects
  - target:
      kind: Namespace
    patch: |-
      apiVersion: v1
      kind: Namespace
      metadata:
        name: not-used
        labels:
          pod-security.kubernetes.io/enforce: privileged
resources:
  - ./gitlab-runner/ks.yaml
