---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: rook-ceph-cluster
spec:
  interval: 15m
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    tag: 1.21.1
  url: oci://ghcr.io/rook/rook-ceph-cluster
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rook-ceph-cluster
spec:
  chartRef:
    kind: OCIRepository
    name: rook-ceph-cluster
  interval: 1h
  timeout: 30m
  values:
    monitoring:
      enabled: true
      createPrometheusRules: true
    toolbox:
      enabled: true
    route:
      dashboard:
        host:
          name: rook.pipitonelabs.com
          path: /
          pathType: PathPrefix
        parentRefs:
          - name: envoy-internal
            namespace: networking
    cephClusterSpec:
      cleanupPolicy:
        wipeDevicesFromOtherClusters: true
      crashCollector:
        disable: false
      csi:
        # The cluster requires msgr2 (network.connections.requireMsgr2), but the kernel CephFS client defaults to
        # msgr v1, so CephFS mounts fail with "no mds (Metadata Server) is up". With the ceph-csi-operator the mount
        # options are read from here (not from the operator's csi.cephFSKernelMountOptions) and copied into the
        # ClientProfile.
        cephfs:
          kernelMountOptions: ms_mode=prefer-crc
        readAffinity:
          enabled: true
      # Daemon resources must live under spec.resources.{mgr,mon,osd}; values under the
      # per-daemon keys (mgr:/mon:/osd:) are pruned by the CRD and never applied. No CPU
      # limits (throttling hurts Ceph latency). OSD memory must stay at 4Gi: osd_memory_target
      # is derived from the limit.
      resources:
        mgr:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            memory: 1536Mi
        mon:
          requests:
            cpu: 100m
            memory: 1Gi
          limits:
            memory: 2Gi
        osd:
          requests:
            cpu: 500m
            memory: 4Gi
          limits:
            memory: 4Gi
      # Rotate daemon/service cephx keys to the new aes256k key type (Ceph 20.2.4,
      # CVE-2025-30156). Clears the AUTH_INSECURE_SERVICE_KEY_TYPE / _SERVICE_TICKETS
      # HEALTH_ERR. Rook auto-rotates admin + daemon keys and their Secret mirrors;
      # bumping keyGeneration triggers the rotation (current status generation: 1).
      # NOTE: CSI client keys are intentionally pinned to aes — aes256k needs
      # kernel 7.0+, and these nodes run 6.18.x (Talos, incl. 1.14.x). Rotating CSI
      # keys to aes256k now would break PVC mounts. Revisit once nodes run kernel 7.0+.
      security:
        cephx:
          daemon:
            keyRotationPolicy: KeyGeneration
            keyGeneration: 2
          csi:
            keyType: aes
      # Mute the residual cephx "insecure key type" warnings that remain after the
      # daemon-key rotation. These are expected and unfixable until CSI keys can move
      # to aes256k (kernel 7.0+): the CSI client keys stay on aes, and the mons must
      # keep allowing/creating aes keys for them. Muting returns Ceph to HEALTH_OK so
      # the tuppr TalosUpgrade health gate passes and CephHealthWarning stops firing.
      # Remove these mutes once CSI keys are rotated to aes256k.
      healthCheck:
        muteHealthWarning:
          AUTH_INSECURE_CLIENT_KEY_TYPE:
            policy: mute
          AUTH_INSECURE_KEYS_ALLOWED:
            policy: mute
          AUTH_INSECURE_KEYS_CREATABLE:
            policy: mute
          AUTH_INSECURE_ROTATING_SERVICE_KEY_TYPE:
            policy: mute
      dashboard:
        enabled: true
        urlPrefix: /
        ssl: false
        prometheusEndpoint: http://prometheus-operated.observability.svc.cluster.local:9090
      mgr:
        modules:
          - name: pg_autoscaler
            enabled: true
      mon:
      network:
        connections:
          requireMsgr2: true
      # Ceph daemons run on m0-m2 and the bare-metal worker w2 (OSD host); the Proxmox VM workers are
      # Ceph clients only. Mons and mgrs stay on the control-plane nodes.
      placement:
        all:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
                - matchExpressions:
                    - key: kubernetes.io/hostname
                      operator: In
                      values: [m0, m1, m2, w2]
        mon: &controlPlane
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
                - matchExpressions:
                    - key: node-role.kubernetes.io/control-plane
                      operator: Exists
        mgr: *controlPlane
      storage:
        # Explicit list so worker nodes (Ceph clients only) never get an OSD-prepare job
        useAllNodes: false
        useAllDevices: false
        deviceFilter: nvme1n1
        nodes:
          - name: m0
          - name: m1
          - name: m2
          - name: w2
            devices:
              - name: /dev/disk/by-id/nvme-ZETTASTONE_CP200_1024GB_ZSP02OV1TCB824344536
      osd:
    cephBlockPools:
      - name: ceph-blockpool
        spec:
          failureDomain: host
          replicated:
            size: 3
        storageClass:
          enabled: true
          name: ceph-block
          isDefault: true
          reclaimPolicy: Retain
          allowVolumeExpansion: true
          parameters:
            imageFormat: "2"
            imageFeatures: layering,exclusive-lock,object-map,fast-diff,deep-flatten
            csi.storage.k8s.io/provisioner-secret-name: rook-csi-rbd-provisioner
            csi.storage.k8s.io/provisioner-secret-namespace: "{{ .Release.Namespace }}"
            csi.storage.k8s.io/controller-expand-secret-name: rook-csi-rbd-provisioner
            csi.storage.k8s.io/controller-expand-secret-namespace: "{{ .Release.Namespace }}"
            csi.storage.k8s.io/node-stage-secret-name: rook-csi-rbd-node
            csi.storage.k8s.io/node-stage-secret-namespace: "{{ .Release.Namespace }}"
            csi.storage.k8s.io/fstype: ext4
    cephBlockPoolsVolumeSnapshotClass:
      enabled: true
      name: csi-ceph-block
      isDefault: false
      deletionPolicy: Delete
    cephFileSystems:
      - name: &cephFileSystemName ceph-filesystem
        spec:
          metadataPool:
            replicated:
              size: 3
          dataPools:
            - failureDomain: host
              replicated:
                size: 3
              name: data0
          metadataServer:
            activeCount: 1
            activeStandby: true
            priorityClassName: system-cluster-critical
            placement:
              nodeAffinity:
                requiredDuringSchedulingIgnoredDuringExecution:
                  nodeSelectorTerms:
                    - matchExpressions:
                        - key: node-role.kubernetes.io/control-plane
                          operator: Exists
              topologySpreadConstraints:
                - maxSkew: 1
                  topologyKey: kubernetes.io/hostname
                  whenUnsatisfiable: DoNotSchedule
                  labelSelector:
                    matchLabels:
                      app.kubernetes.io/name: ceph-mds
                      app.kubernetes.io/part-of: *cephFileSystemName
            resources:
              requests:
                cpu: 100m
                memory: 1Gi
              limits:
                memory: 4Gi
        storageClass:
          enabled: true
          isDefault: false
          name: ceph-filesystem
          pool: data0
          reclaimPolicy: Retain
          allowVolumeExpansion: true
          volumeBindingMode: Immediate
          parameters:
            csi.storage.k8s.io/provisioner-secret-name: rook-csi-cephfs-provisioner
            csi.storage.k8s.io/provisioner-secret-namespace: "{{ .Release.Namespace }}"
            csi.storage.k8s.io/controller-expand-secret-name: rook-csi-cephfs-provisioner
            csi.storage.k8s.io/controller-expand-secret-namespace: "{{ .Release.Namespace }}"
            csi.storage.k8s.io/node-stage-secret-name: rook-csi-cephfs-node
            csi.storage.k8s.io/node-stage-secret-namespace: "{{ .Release.Namespace }}"
            csi.storage.k8s.io/fstype: ext4
    cephFileSystemVolumeSnapshotClass:
      enabled: true
      name: csi-ceph-filesystem
      isDefault: false
      deletionPolicy: Delete
    cephObjectStores: []
