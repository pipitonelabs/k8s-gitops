---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: rook-ceph
spec:
  interval: 15m
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    tag: v1.20.8
  url: oci://ghcr.io/rook/rook-ceph
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rook-ceph
spec:
  chartRef:
    kind: OCIRepository
    name: rook-ceph
  interval: 1h
  values:
    csi:
      cephFSKernelMountOptions: ms_mode=prefer-crc
      enableLiveness: true
      # csi-provisioner v6.2.0 (Rook v1.20.8's default) can leave the volumesnapshot-as-source-protection
      # finalizer on a VolSync temp snapshot after a write conflict, and nothing ever removes it. The
      # snapshot then never finishes deleting and that app's backups stop. v6.2.1 adds a sweep that
      # cleans these up. Remove this override once Rook ships csi-provisioner >= v6.2.1.
      provisioner:
        tag: v6.2.1
      serviceMonitor:
        enabled: true
    image:
      repository: ghcr.io/rook/ceph
    monitoring:
      enabled: true
    resources:
      requests:
        cpu: 100m # unchangable
        memory: 128Mi # unchangable
      limits: {}
