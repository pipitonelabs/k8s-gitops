---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: rook-ceph
spec:
  interval: 15m
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    tag: 1.21.1
  url: oci://ghcr.io/rook/rook-ceph
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rook-ceph
spec:
  chartRef:
    kind: OCIRepository
    name: rook-ceph
  interval: 1h
  values:
    csi:
      enableLiveness: true
      # csi-provisioner v6.3.0 logs a Warning VolumeFailedDelete each time a VolSync temp PV is deleted
      # before it finishes detaching. v6.4.0 reports the wait as a Normal event. Remove this override
      # once the ceph-csi-operator default is csi-provisioner >= v6.4.0.
      provisioner:
        repository: registry.k8s.io/sig-storage/csi-provisioner
        tag: v6.4.0
      serviceMonitor:
        enabled: true
    image:
      repository: ghcr.io/rook/ceph
    monitoring:
      enabled: true
    resources:
      requests:
        cpu: 100m # unchangable
        memory: 128Mi # unchangable
      limits: {}
