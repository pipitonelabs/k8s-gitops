---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: etcd-defrag
spec:
  # Monthly: etcd is never auto-defragmented, so the database drifts past the 50% fragmentation alert threshold
  schedule: 30 4 1 * *
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      ttlSecondsAfterFinished: 86400
      template:
        spec:
          serviceAccountName: etcd-defrag
          automountServiceAccountToken: false
          restartPolicy: OnFailure
          securityContext:
            runAsUser: 1000
            runAsGroup: 100
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          # One member at a time (followers first, leader last) so quorum is never at risk
          initContainers:
            - name: defrag-m1
              image: ghcr.io/siderolabs/talosctl:v1.14.6@sha256:82c9a9985fc7292a222e680414c65955ac0566db588b84d88f620b05d16b1d5b
              args:
                - --nodes=192.168.10.11
                - --endpoints=192.168.10.11
                - etcd
                - defrag
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - mountPath: /var/run/secrets/talos.dev
                  name: talos
                  readOnly: true
            - name: defrag-m2
              image: ghcr.io/siderolabs/talosctl:v1.14.6@sha256:82c9a9985fc7292a222e680414c65955ac0566db588b84d88f620b05d16b1d5b
              args:
                - --nodes=192.168.10.12
                - --endpoints=192.168.10.12
                - etcd
                - defrag
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - mountPath: /var/run/secrets/talos.dev
                  name: talos
                  readOnly: true
            - name: defrag-m0
              image: ghcr.io/siderolabs/talosctl:v1.14.6@sha256:82c9a9985fc7292a222e680414c65955ac0566db588b84d88f620b05d16b1d5b
              args:
                - --nodes=192.168.10.10
                - --endpoints=192.168.10.10
                - etcd
                - defrag
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - mountPath: /var/run/secrets/talos.dev
                  name: talos
                  readOnly: true
          containers:
            - name: status
              image: ghcr.io/siderolabs/talosctl:v1.14.6@sha256:82c9a9985fc7292a222e680414c65955ac0566db588b84d88f620b05d16b1d5b
              args:
                - --nodes=192.168.10.10
                - --endpoints=192.168.10.10
                - etcd
                - status
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - mountPath: /var/run/secrets/talos.dev
                  name: talos
                  readOnly: true
          volumes:
            - name: talos
              secret:
                secretName: etcd-defrag
