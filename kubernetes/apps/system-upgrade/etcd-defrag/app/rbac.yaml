---
# No Kubernetes RBAC: the job only talks to the Talos API, so this SA has no bindings.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: etcd-defrag
automountServiceAccountToken: false
---
apiVersion: talos.dev/v1alpha1
kind: ServiceAccount
metadata:
  name: etcd-defrag
spec:
  # etcd defrag requires os:admin or os:operator (must be listed in allowedRoles in talos/controlplane.yaml.j2)
  roles: ["os:operator"]
