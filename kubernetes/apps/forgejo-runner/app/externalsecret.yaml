---
# yaml-language-server: $schema=https://kube-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# Shared secret for offline runner registration. It must be a 40 character hex
# string (openssl rand -hex 20) and is registered on the Forgejo server once with
# `forgejo forgejo-cli actions register`.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-runner-secret
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: forgejo-runner-secret
    creationPolicy: Owner
  data:
    - secretKey: FORGEJO_RUNNER_SECRET
      remoteRef:
        key: forgejo
        property: FORGEJO_RUNNER_SECRET
