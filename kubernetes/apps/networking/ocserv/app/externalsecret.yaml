---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# 1Password item "ocserv" with fields username and password.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ocserv
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: ocserv-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      metadata:
        annotations:
          reloader.stakater.com/auto: "true"
      data:
        USERNAME: "{{ .username }}"
        PASSWORD: "{{ .password }}"
  dataFrom:
    - extract:
        key: ocserv
