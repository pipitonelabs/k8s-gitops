---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ocserv
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  interval: 1h
  values:
    controllers:
      main:
        annotations:
          reloader.stakater.com/auto: "true"
        replicas: 1
        strategy: Recreate
        initContainers:
          passwd:
            image:
              repository: mirror.gcr.io/library/alpine
              tag: 3.24@sha256:294b683cb724975bec92580e1e685676bd4b50bda910ddb8c51d4cabeaec77e6
            command: ["/bin/sh", "/scripts/passwd.sh"]
            envFrom:
              - secretRef:
                  name: ocserv-secret
        containers:
          app:
            image:
              repository: ghcr.io/gifi71/ocserv-docker
              tag: 1.5.0@sha256:cbd3c4e98261f2879aea86c9fcaab370722ed84d66f811fd61090120348ff02d
            env:
              VPN_NETWORK: 192.168.255.0/24
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  exec:
                    command: ["/usr/local/bin/healthcheck.sh"]
                  initialDelaySeconds: 15
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *probes
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 256Mi
            securityContext:
              allowPrivilegeEscalation: true
              readOnlyRootFilesystem: false
              capabilities:
                add:
                  - NET_ADMIN
                  - NET_RAW
                  - NET_BIND_SERVICE
    defaultPodOptions:
      # User namespaces block /dev/net/tun on this cluster.
      hostUsers: true
      securityContext:
        sysctls:
          - name: net.ipv4.ip_forward
            value: "1"
    persistence:
      config:
        type: configMap
        name: ocserv-configmap
        advancedMounts:
          main:
            app:
              - path: /etc/ocserv/ocserv.conf
                subPath: ocserv.conf
                readOnly: true
            passwd:
              - path: /scripts/passwd.sh
                subPath: passwd.sh
                readOnly: true
      tls:
        type: secret
        name: pipitonelabs-com-tls
        advancedMounts:
          main:
            app:
              - path: /etc/ocserv/tls.crt
                subPath: tls.crt
                readOnly: true
              - path: /etc/ocserv/tls.key
                subPath: tls.key
                readOnly: true
      passwd:
        type: emptyDir
        globalMounts:
          - path: /var/lib/ocserv
      tun:
        type: hostPath
        hostPath: /dev/net/tun
        hostPathType: CharDevice
        globalMounts:
          - path: /dev/net/tun
    service:
      app:
        type: LoadBalancer
        controller: main
        externalTrafficPolicy: Local
        annotations:
          lbipam.cilium.io/ips: 192.168.20.82
        ports:
          vpn:
            port: 443
            protocol: TCP
            targetPort: 443
