# TCP only. UDP 443 already completes a handshake on the filtered Wi-Fi and then drops data.
auth = "plain[passwd=/var/lib/ocserv/ocpasswd]"
tcp-port = 443
udp-port = 0

run-as-user = ocserv
run-as-group = ocserv
socket-file = /var/run/ocserv.socket
server-cert = /etc/ocserv/tls.crt
server-key = /etc/ocserv/tls.key
isolate-workers = false

max-clients = 8
max-same-clients = 2
rate-limit-ms = 100
keepalive = 32400
dpd = 90
mobile-dpd = 1800
try-mtu-discovery = true
# Small enough that the filtered Wi-Fi does not blackhole the first data packet.
mtu = 1280
server-stats-reset-time = 604800
auth-timeout = 240
idle-timeout = 1200
mobile-idle-timeout = 2400
min-reauth-time = 60
max-ban-score = 80
ban-reset-time = 1200
cookie-timeout = 86400
deny-roaming = false
rekey-time = 172800
rekey-method = ssl
use-occtl = true

device = vpns
predictable-ips = true
default-domain = pipitonelabs.com
ipv4-network = 192.168.255.0
ipv4-netmask = 255.255.255.0

tunnel-all-dns = false
dns = 192.168.10.1

# Pushed to the client. 10.244.0.0/16 is the pod network, so the whole 10/8 is not advertised.
route = 192.168.10.0/255.255.255.0
route = 192.168.20.0/255.255.255.0
route = 10.69.1.0/255.255.255.0

cisco-client-compat = true
dtls-legacy = false
