---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./externalsecret.yaml
  - ./helmrelease.yaml
configMapGenerator:
  - name: ocserv-configmap
    files:
      - ocserv.conf=./resources/ocserv.conf
      - passwd.sh=./resources/passwd.sh
generatorOptions:
  disableNameSuffixHash: true
