---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: networking
components:
  - ../../components/namespace
patches:
  - target:
      kind: Namespace
    patch: |-
      apiVersion: v1
      kind: Namespace
      metadata:
        name: not-used
        labels:
          # tailscale proxies are privileged (multus, when enabled, too)
          pod-security.kubernetes.io/enforce: privileged
resources:
  - ./certificates/ks.yaml
  - ./cloudflared/ks.yaml
  - ./echo-server/ks.yaml
  - ./envoy-gateway/ks.yaml
  - ./external-dns/ks.yaml
#  - ./multus/ks.yaml
  - ./network-optimizer/ks.yaml
  - ./sing-box/ks.yaml
  - ./sing-box-dashboard/ks.yaml
  - ./tailscale-operator/ks.yaml
