---
# iot VLAN 40 (10.69.40.0/24), where the Pipitone-IoT SSID lives.
# No gateway or routes: only the VLAN's own subnet goes through this interface.
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: multus-iot
spec:
  config: |-
    {
      "cniVersion": "0.3.1",
      "name": "multus-iot",
      "plugins": [
        {
          "type": "macvlan",
          "master": "bond0.40",
          "mode": "bridge",
          "capabilities": {"ips": true, "mac": true},
          "ipam": {"type": "static"}
        }
      ]
    }
