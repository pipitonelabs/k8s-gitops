---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: sing-box
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  interval: 1h
  values:
    controllers:
      main:
        annotations:
          reloader.stakater.com/auto: "true"
        replicas: 1
        strategy: Recreate
        initContainers:
          render:
            image:
              repository: mirror.gcr.io/library/alpine
              tag: 3.24@sha256:294b683cb724975bec92580e1e685676bd4b50bda910ddb8c51d4cabeaec77e6
            command: ["/bin/sh", "/templates/render.sh"]
            envFrom:
              - secretRef:
                  name: sing-box-secret
        containers:
          app:
            image:
              repository: ghcr.io/sagernet/sing-box
              tag: v1.14.3@sha256:80c639ba467885b28511fb7c980565c2d30a8752f778e7bc8abdbc91fbfd95ec
            args: ["run", "-c", "/etc/sing-box/config.json"]
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 443
                  initialDelaySeconds: 10
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *probes
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 256Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
                add: ["NET_BIND_SERVICE"]
    defaultPodOptions:
      securityContext:
        runAsNonRoot: false
        runAsUser: 0
        runAsGroup: 0
    persistence:
      config:
        type: emptyDir
        globalMounts:
          - path: /etc/sing-box
      templates:
        type: configMap
        name: sing-box-configmap
        globalMounts:
          - path: /templates
            readOnly: true
    service:
      app:
        type: LoadBalancer
        controller: main
        externalTrafficPolicy: Local
        annotations:
          lbipam.cilium.io/ips: 192.168.20.82
        ports:
          vless:
            port: 443
            protocol: TCP
            targetPort: 443
          clash-api:
            port: 9090
            protocol: TCP
            targetPort: 9090
