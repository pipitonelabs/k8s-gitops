---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# 1Password item "sing-box" with fields uuid, private_key, and short_id.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sing-box
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: sing-box-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      metadata:
        annotations:
          reloader.stakater.com/auto: "true"
      data:
        UUID: "{{ .uuid }}"
        PRIVATE_KEY: "{{ .private_key }}"
        SHORT_ID: "{{ .short_id }}"
  dataFrom:
    - extract:
        key: sing-box
