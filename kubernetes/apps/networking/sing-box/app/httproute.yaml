---
# yaml-language-server: $schema=https://kube-schemas.pages.dev/gateway.networking.k8s.io/httproute_v1.json
# Internal-only route for sing-box's Clash API. The metacubexd dashboard is
# served over HTTPS, so it can't call the API over plain HTTP (mixed-content
# blocked by browsers) — this fronts the API with TLS via envoy-internal too,
# terminating TLS at the gateway while still talking plain HTTP to sing-box
# in-cluster. TLS via the shared *.pipitonelabs.com wildcard cert;
# external-dns auto-creates the internal DNS record.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: sing-box-clash-api
spec:
  hostnames: ["singbox-api.pipitonelabs.com"]
  parentRefs:
    - name: envoy-internal
      namespace: networking
  rules:
    - backendRefs:
        - name: sing-box
          port: 9090
