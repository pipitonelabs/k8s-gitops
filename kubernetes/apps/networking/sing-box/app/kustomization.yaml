---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./externalsecret.yaml
  - ./helmrelease.yaml
configMapGenerator:
  - name: sing-box-configmap
    files:
      - config.json.tpl=./resources/config.json.tpl
      - render.sh=./resources/render.sh
generatorOptions:
  disableNameSuffixHash: true
