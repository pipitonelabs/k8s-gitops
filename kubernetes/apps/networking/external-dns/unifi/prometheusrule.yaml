---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: external-dns-unifi
spec:
  groups:
    - name: external-dns-unifi.rules
      rules:
        - alert: ExternalDNSUnifiStale
          # external-dns syncs every ~60s (--interval=1m), so lag routinely
          # sits at 60-90s between syncs. A 60s threshold false-fires on
          # every cycle; 300s gives real headroom before alerting.
          expr: |-
            time() - external_dns_controller_last_sync_timestamp_seconds{job="external-dns-unifi"} > 300
          for: 5m
          annotations:
            summary: >-
              ExternalDNS ({{ $labels.job }}) has not synced successfully in the last five minutes
          labels:
            severity: critical
