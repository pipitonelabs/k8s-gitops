---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: network-optimizer
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  interval: 1h
  values:
    controllers:
      network-optimizer:
        containers:
          app:
            image:
              repository: ghcr.io/ozark-connect/network-optimizer
              tag: 2.10.1@sha256:4cb0f1e06baa67402ca60f09a0c6759badb450b12a95b3a446e2e49c36000d1c
            env: &env
              TZ: America/New_York
              REVERSE_PROXIED_HOST_NAME: optimizer.pipitonelabs.com
              # Served directly by the speedtest LoadBalancer (not Envoy) so tests stay on HTTP/1.1
              OPENSPEEDTEST_HOST: speedtest.pipitonelabs.com
              OPENSPEEDTEST_PORT: "3005"
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/health
                    port: &port 8042
                  initialDelaySeconds: 0
                  periodSeconds: 30
                  timeoutSeconds: 10
                  failureThreshold: 3
              readiness: *probes
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/health
                    port: *port
                  periodSeconds: 10
                  failureThreshold: 12
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                memory: 1Gi
            securityContext:
              allowPrivilegeEscalation: false
              # The entrypoint starts as root, chowns /app/data and drops to the "app" user
              capabilities:
                drop: ["ALL"]
                add: ["CHOWN", "DAC_OVERRIDE", "FOWNER", "SETGID", "SETUID"]
      speedtest:
        containers:
          app:
            image:
              repository: ghcr.io/ozark-connect/speedtest
              tag: 2.10.1@sha256:781ebe555d62e2b0276a8fbf4a01865e64f839a024331c7600ff3f447d4f3262
            env: *env
            probes:
              liveness: &speedtestProbes
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: &speedtestTargetPort 3000
                  periodSeconds: 30
                  failureThreshold: 3
              readiness: *speedtestProbes
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 256Mi
            securityContext:
              allowPrivilegeEscalation: false
              # nginx entrypoint renders config as root, then workers drop to the nginx user
              capabilities:
                drop: ["ALL"]
                add: ["CHOWN", "DAC_OVERRIDE", "FOWNER", "SETGID", "SETUID"]
    persistence:
      data:
        existingClaim: "{{ .Release.Name }}"
        advancedMounts:
          network-optimizer:
            app:
              - path: /app/data
      logs:
        type: emptyDir
        advancedMounts:
          network-optimizer:
            app:
              - path: /app/logs
    route:
      app:
        annotations:
          gatus.home-operations.com/endpoint: |-
            group: networking
        hostnames: ["optimizer.pipitonelabs.com"]
        parentRefs:
          - name: envoy-internal
            namespace: networking
        rules:
          - backendRefs:
              - identifier: app
                port: *port
    service:
      app:
        controller: network-optimizer
        primary: true
        ports:
          http:
            port: *port
      speedtest:
        type: LoadBalancer
        controller: speedtest
        annotations:
          external-dns.alpha.kubernetes.io/hostname: speedtest.pipitonelabs.com
          lbipam.cilium.io/ips: 192.168.20.84
        ports:
          http:
            port: 3005
            targetPort: *speedtestTargetPort
