---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: network-optimizer
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  interval: 1h
  values:
    controllers:
      network-optimizer:
        containers:
          app:
            image:
              repository: ghcr.io/ozark-connect/network-optimizer
              tag: 2.11.6@sha256:bfd0131286aae84446e1ca087525d81232199e20c4a2b249bd10cd6e73632c98
            env: &env
              TZ: America/New_York
              REVERSE_PROXIED_HOST_NAME: optimizer.pipitonelabs.com
              # Served directly by the speedtest LoadBalancer (not Envoy) so tests stay on HTTP/1.1
              OPENSPEEDTEST_HOST: speedtest.pipitonelabs.com
              OPENSPEEDTEST_PORT: "3005"
              # iperf3 server on 5201 in the app container, exposed by the iperf3 LoadBalancer
              Iperf3Server__Enabled: "true"
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/health
                    port: &port 8042
                  initialDelaySeconds: 0
                  periodSeconds: 30
                  timeoutSeconds: 10
                  failureThreshold: 3
              readiness: *probes
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/health
                    port: *port
                  periodSeconds: 10
                  failureThreshold: 12
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                memory: 1Gi
            securityContext:
              allowPrivilegeEscalation: false
              # The entrypoint starts as root, chowns /app/data and drops to the "app" user
              capabilities:
                drop: ["ALL"]
                add: ["CHOWN", "DAC_OVERRIDE", "FOWNER", "SETGID", "SETUID"]
          # The Client Speed Test page health-checks http://127.0.0.1:<OPENSPEEDTEST_PORT> and hides the
          # browser test when that fails; forward it to the speedtest pod's Service
          speedtest-proxy:
            image:
              repository: docker.io/alpine/socat
              tag: 1.8.1.3@sha256:5aa280c6fc5bee94dbd2bbdf2a58d30f50396eaa110be84b03636945b157ae68
            args:
              - TCP-LISTEN:3005,bind=127.0.0.1,fork,reuseaddr
              - TCP:network-optimizer-speedtest.networking.svc.cluster.local:3005
            resources:
              requests:
                cpu: 5m
                memory: 8Mi
              limits:
                memory: 32Mi
            securityContext:
              runAsNonRoot: true
              runAsUser: 65534
              runAsGroup: 65534
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
      speedtest:
        containers:
          app:
            image:
              repository: ghcr.io/ozark-connect/speedtest
              tag: 2.11.6@sha256:ecb6da1107e9a7ec5ead5a48c906fb5d8c036cfe40a4db57111d0df06e89550f
            env: *env
            probes:
              liveness: &speedtestProbes
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: &speedtestTargetPort 3000
                  periodSeconds: 30
                  failureThreshold: 3
              readiness: *speedtestProbes
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 256Mi
            securityContext:
              allowPrivilegeEscalation: false
              # nginx entrypoint renders config as root, then workers drop to the nginx user
              capabilities:
                drop: ["ALL"]
                add: ["CHOWN", "DAC_OVERRIDE", "FOWNER", "SETGID", "SETUID"]
    persistence:
      data:
        existingClaim: "{{ .Release.Name }}"
        advancedMounts:
          network-optimizer:
            app:
              - path: /app/data
      logs:
        type: emptyDir
        advancedMounts:
          network-optimizer:
            app:
              - path: /app/logs
    route:
      app:
        annotations:
          gatus.home-operations.com/endpoint: |-
            group: networking
        hostnames: ["optimizer.pipitonelabs.com"]
        parentRefs:
          - name: envoy-internal
            namespace: networking
        rules:
          - backendRefs:
              - identifier: app
                port: *port
    service:
      app:
        controller: network-optimizer
        primary: true
        ports:
          http:
            port: *port
      speedtest:
        type: LoadBalancer
        controller: speedtest
        annotations:
          external-dns.alpha.kubernetes.io/hostname: speedtest.pipitonelabs.com
          lbipam.cilium.io/ips: 192.168.20.84
        ports:
          http:
            port: 3005
            targetPort: *speedtestTargetPort
      iperf3:
        type: LoadBalancer
        controller: network-optimizer
        annotations:
          external-dns.alpha.kubernetes.io/hostname: iperf.pipitonelabs.com
          lbipam.cilium.io/ips: 192.168.20.87
        ports:
          tcp:
            port: 5201
            protocol: TCP
          udp:
            port: 5201
            protocol: UDP
