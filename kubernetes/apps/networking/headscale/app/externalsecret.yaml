---
# yaml-language-server: $schema=https://kube-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# OIDC client secret for the Authentik provider (not yet enabled in config.yaml).
# 1Password item "headscale" needs the field HEADSCALE_OIDC_CLIENT_SECRET.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: headscale
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: headscale-secret
    template:
      data:
        HEADSCALE_OIDC_CLIENT_SECRET: "{{ .HEADSCALE_OIDC_CLIENT_SECRET }}"
  dataFrom:
    - extract:
        key: headscale
