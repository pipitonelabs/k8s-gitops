---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: headscale-test-router
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: headscale-test-router-secret
    template:
      data:
        TS_AUTHKEY: "{{ .HEADSCALE_TEST_ROUTER_AUTHKEY }}"
  dataFrom:
    - extract:
        key: headscale
