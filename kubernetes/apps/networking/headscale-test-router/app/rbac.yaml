---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: headscale-test-router
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: headscale-test-router
rules:
  # containerboot creates the state secret if it does not exist
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["headscale-test-router-state"]
    verbs: ["get", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: headscale-test-router
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: headscale-test-router
subjects:
  - kind: ServiceAccount
    name: headscale-test-router
