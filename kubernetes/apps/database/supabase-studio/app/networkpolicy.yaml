---
# yaml-language-server: $schema=https://kube-schemas.pages.dev/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: supabase-studio-ingress
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: supabase-studio
  ingress:
    # UI via envoy-internal
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: networking
            app.kubernetes.io/name: envoy
            gateway.envoyproxy.io/owning-gateway-name: envoy-internal
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
    # kubelet probes
    - fromEntities:
        - host
        - remote-node
        - kube-apiserver
    # Replies to this pod's own outbound service connections. Cilium can drop
    # same-node rev-NATed replies as new ingress, so allow the backends.
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: networking
            gateway.envoyproxy.io/owning-gateway-name: envoy-internal
---
# yaml-language-server: $schema=https://kube-schemas.pages.dev/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: supabase-postgres-meta-ingress
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: supabase-postgres-meta
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: database
            app.kubernetes.io/name: supabase-studio
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    - fromEntities:
        - host
        - remote-node
        - kube-apiserver
    # Replies to this pod's own outbound service connections. Cilium can drop
    # same-node rev-NATed replies as new ingress, so allow the backends.
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: networking
            gateway.envoyproxy.io/owning-gateway-name: envoy-internal
