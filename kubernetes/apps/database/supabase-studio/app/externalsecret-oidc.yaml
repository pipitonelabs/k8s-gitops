---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ops-tools-oidc
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: ops-tools-oidc
    template:
      engineVersion: v2
      data:
        client-secret: "{{ .OPS_TOOLS_OIDC_CLIENT_SECRET }}"
  data:
    - secretKey: OPS_TOOLS_OIDC_CLIENT_SECRET
      remoteRef:
        key: ops-tools
        property: OPS_TOOLS_OIDC_CLIENT_SECRET
