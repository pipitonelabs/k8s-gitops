---
# Staggered daily base backups (UTC, seconds-first cron) kept clear of hourly VolSync at :00 and the */4 pg dumps at :05
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/postgresql.cnpg.io/scheduledbackup_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: postgres17
spec:
  schedule: "0 20 1 * * *" # 01:20 UTC
  immediate: true
  backupOwnerReference: self
  cluster:
    name: postgres17

  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io

---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/postgresql.cnpg.io/scheduledbackup_v1.json
