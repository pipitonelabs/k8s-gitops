---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: openebs-system
components:
  - ../../components/namespace
patches:
  - target:
      kind: Namespace
    patch: |-
      apiVersion: v1
      kind: Namespace
      metadata:
        name: not-used
        labels:
          # localpv hostpath helper pods use hostPath
          pod-security.kubernetes.io/enforce: privileged
resources:
  - ./openebs/ks.yaml
