---
apiVersion: kubevirt.io/v1
kind: KubeVirt
metadata:
  name: kubevirt
  namespace: kubevirt
spec:
  certificateRotateStrategy:
    selfSigned:
      ca:
        duration: 720h
        renewBefore: 240h
      server:
        duration: 168h
        renewBefore: 48h
  configuration:
    developerConfiguration:
      useEmulation: false
  imagePullPolicy: IfNotPresent
  workloadUpdateStrategy:
    workloadUpdateMethods:
      - LiveMigrate
