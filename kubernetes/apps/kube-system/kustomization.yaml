---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: kube-system
components:
  - ../../components/namespace
patches:
  - target:
      kind: Namespace
    patch: |-
      apiVersion: v1
      kind: Namespace
      metadata:
        name: not-used
        labels:
          # cilium, csi-driver-nfs, irqbalance, intel-gpu, generic-device-plugin use host namespaces/hostPath/privileged
          pod-security.kubernetes.io/enforce: privileged
resources:
  - ./cilium/ks.yaml
  - ./coredns/ks.yaml
  - ./csi-driver-nfs/ks.yaml
  - ./descheduler/ks.yaml
  - ./generic-device-plugin/ks.yaml
  - ./intel-gpu-resource-driver/ks.yaml
  - ./irqbalance/ks.yaml
  - ./metrics-server/ks.yaml
  - ./reloader/ks.yaml
  - ./spegel/ks.yaml
  - ./snapshot-controller/ks.yaml
