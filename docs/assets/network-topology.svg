<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 800" width="1240" height="800" role="img" aria-label="Home network topology: Frontier Fiber and Starlink into a UCG Fiber, then two UniFi switches serving the Kubernetes nodes, storage, servers, and clients."><style>
:root{--bg:#ffffff;--fg:#1f2937;--mut:#5b6472;--line:#94a3b8;--card:#f8fafc;--stroke:#cbd5e1;--grp:#f1f5f9;--lb:#ffffff;
