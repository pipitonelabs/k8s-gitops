<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 422" width="1000" height="422" role="img" aria-label="GitOps flow: changes from me or Renovate open a pull request, CI checks it, the merge to main triggers a Flux webhook, and Flux reconciles the cluster."><style>
:root{--bg:#ffffff;--fg:#1f2937;--mut:#5b6472;--line:#94a3b8;--card:#f8fafc;--stroke:#cbd5e1;--grp:#f1f5f9;--lb:#ffffff;
--src:#ede9fe;--srcs:#7c3aed;--git:#dbeafe;--gits:#2563eb;--ci:#fef3c7;--cis:#d97706;--flux:#d1fae5;--fluxs:#059669;--k8s:#e0f2fe;--k8ss:#0284c7}
@media (prefers-color-scheme:dark){:root{--bg:#0d1117;--fg:#e6edf3;--mut:#9aa7b4;--line:#7d8590;--card:#161b22;--stroke:#30363d;--grp:#0f141b;--lb:#21262d;
--src:#271b4d;--srcs:#a78bfa;--git:#12284a;--gits:#60a5fa;--ci:#3a2d0d;--cis:#fbbf24;--flux:#0f3328;--fluxs:#34d399;--k8s:#0c2a3d;--k8ss:#38bdf8}}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:var(--fg)}
.page{fill:var(--bg)}
.t{font-size:15px;font-weight:600}.s{font-size:12.5px;fill:var(--mut)}.g{font-size:13px;font-weight:600;fill:var(--mut)}
.lt{font-size:11.5px;font-weight:600}.r{font-size:13px;font-weight:600}.rm{font-weight:400;fill:var(--mut)}
.dev{fill:var(--card);stroke:var(--stroke);stroke-width:1.2}
.src{fill:var(--src);stroke:var(--srcs);stroke-width:1.8}.git{fill:var(--git);stroke:var(--gits);stroke-width:1.8}
.ci{fill:var(--ci);stroke:var(--cis);stroke-width:1.8}.flux{fill:var(--flux);stroke:var(--fluxs);stroke-width:1.8}
.k8s{fill:var(--k8s);stroke:var(--k8ss);stroke-width:1.8}
.grp{fill:var(--grp);stroke:var(--stroke);stroke-dasharray:5 4}.lb{fill:var(--lb);stroke:var(--stroke)}
.ic{fill:none;stroke:var(--fg);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.ok{fill:none;stroke:var(--cis);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
path.e{fill:none;stroke:var(--line);stroke-width:2.4}path.e2{fill:none;stroke:var(--line);stroke-width:1.6;stroke-dasharray:6 4}
.ah{fill:var(--line)}
</style><defs><marker id="ah" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto"><path class="ah" d="M0 0L10 5L0 10z"/></marker></defs><rect class="page" width="1000" height="422" rx="14"/><rect class="grp" x="30" y="30" width="270" height="196" rx="12"/><text class="g" x="44" y="52">Changes</text><rect class="src" x="44" y="64" width="242" height="62" rx="10"/><g transform="translate(58,82.0)"><g class="ic"><circle cx="13" cy="8" r="5"/><path d="M3 25c0-5.5 4.5-9 10-9s10 3.5 10 9"/></g></g><text class="t" x="96" y="91.5">Me</text><text class="s" x="96" y="108.5">Feature branch</text><rect class="src" x="44" y="144" width="242" height="62" rx="10"/><g transform="translate(58,162.0)"><g class="ic"><rect x="3" y="8" width="20" height="15" rx="4"/><path d="M13 3v5M1 15v3M25 15v3"/><circle cx="9" cy="15" r="1.6"/><circle cx="17" cy="15" r="1.6"/></g></g><text class="t" x="96" y="171.5">Renovate</text><text class="s" x="96" y="188.5">Dependency update</text><rect class="git" x="350" y="92" width="210" height="72" rx="10"/><g transform="translate(364,115.0)"><g class="ic"><circle cx="6" cy="5" r="3"/><circle cx="6" cy="21" r="3"/><circle cx="20" cy="21" r="3"/><path d="M6 8v10M20 18V10a4 4 0 0 0-4-4h-4M14 3l-3 3 3 3"/></g></g><text class="t" x="402" y="124.5">Pull request</text><text class="s" x="402" y="141.5">Tested before merge</text><rect class="grp" x="608" y="30" width="362" height="196" rx="12"/><text class="g" x="622" y="52">CI checks on every PR</text><rect class="dev" x="622" y="62" width="334" height="34" rx="8"/><path class="ok" d="M636 79l4.5 4.5 8.5-9"/><text class="r" x="660" y="84">flate <tspan class="rm">tests the rendered manifests</tspan></text><rect class="dev" x="622" y="102" width="334" height="34" rx="8"/><path class="ok" d="M636 119l4.5 4.5 8.5-9"/><text class="r" x="660" y="124">Diff <tspan class="rm">of cluster changes posted</tspan></text><rect class="dev" x="622" y="142" width="334" height="34" rx="8"/><path class="ok" d="M636 159l4.5 4.5 8.5-9"/><text class="r" x="660" y="164">Image pre-pull <tspan class="rm">catches bad tags early</tspan></text><rect class="dev" x="622" y="182" width="334" height="34" rx="8"/><path class="ok" d="M636 199l4.5 4.5 8.5-9"/><text class="r" x="660" y="204">zizmor <tspan class="rm">audits the workflows</tspan></text><path class="e" d="M286 95 C 318 95, 318 120, 350 120" marker-end="url(#ah)"/><path class="e" d="M286 175 C 318 175, 318 136, 350 136" marker-end="url(#ah)"/><path class="e" d="M560 128 H 608" marker-end="url(#ah)"/><path class="e" d="M789 226 V 270 Q 789 278 781 278 H 138 Q 130 278 130 286 V 320" marker-end="url(#ah)"/><rect class="lb" x="435.5" y="268" width="49" height="20" rx="5"/><text class="lt" x="460" y="282" text-anchor="middle">Merge</text><rect class="git" x="30" y="320" width="200" height="72" rx="10"/><g transform="translate(44,343.0)"><g class="ic"><circle cx="6" cy="5" r="3"/><circle cx="6" cy="21" r="3"/><circle cx="20" cy="8" r="3"/><path d="M6 8v10M20 11c0 5-6 5-12 8"/></g></g><text class="t" x="82" y="352.5">main</text><text class="s" x="82" y="369.5">What the cluster runs</text><rect class="flux" x="272" y="320" width="200" height="72" rx="10"/><g transform="translate(286,343.0)"><g class="ic"><circle cx="13" cy="15" r="2.5"/><path d="M13 17.5V25M7.5 9.5a8 8 0 0 0 0 11M18.5 9.5a8 8 0 0 1 0 11M4 6a13 13 0 0 0 0 18M22 6a13 13 0 0 1 0 18"/></g></g><text class="t" x="324" y="352.5">Flux webhook</text><text class="s" x="324" y="369.5">Push event from GitHub</text><rect class="flux" x="514" y="320" width="200" height="72" rx="10"/><g transform="translate(528,343.0)"><g class="ic"><path d="M22 11A9.5 9.5 0 0 0 5 8M4 15a9.5 9.5 0 0 0 17 3"/><path d="M5 3v5h5M21 23v-5h-5"/></g></g><text class="t" x="566" y="352.5">Flux</text><text class="s" x="566" y="369.5">Reconciles in order</text><rect class="k8s" x="756" y="320" width="214" height="72" rx="10"/><g transform="translate(770,343.0)"><g class="ic"><path d="M13 1l10 5 2.5 11-7 8.5h-11L.5 17 3 6z"/><circle cx="13" cy="13" r="3.5"/><path d="M13 5v4.5M13 16.5V21M5.5 9l4.5 2.5M16 14.5l4.5 2.5M20.5 9L16 11.5M10 14.5L5.5 17"/></g></g><text class="t" x="808" y="352.5">Cluster</text><text class="s" x="808" y="369.5">Talos · 4 nodes</text><path class="e" d="M230 356 H 272" marker-end="url(#ah)"/><path class="e" d="M472 356 H 514" marker-end="url(#ah)"/><path class="e" d="M714 356 H 756" marker-end="url(#ah)"/></svg>
